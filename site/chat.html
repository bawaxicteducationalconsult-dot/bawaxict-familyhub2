<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store">
<title>BAWAX ICT | Community Chat</title>
<link rel="stylesheet" href="css/bawaxict.css">
<style>
html,body{margin:0;min-height:100%;font-family:Arial,sans-serif}
.center{min-height:100vh;display:grid;place-items:center;padding:20px;box-sizing:border-box}
.panel{max-width:520px;width:100%;text-align:center}
.panel img{max-width:210px;height:auto}
.btn{display:inline-block;text-decoration:none;padding:12px 18px;border-radius:9px;font-weight:800}
.btn-primary{background:#075e54;color:#fff}
.muted{color:#667781;line-height:1.5}
</style>
<style>
/* BAWAX mobile-safety enhancements (shared across pages) */
html,body{width:100%;max-width:100%;overflow-x:hidden}
body{-webkit-text-size-adjust:100%;touch-action:manipulation}
img,canvas,svg,video{max-width:100%;height:auto}
button,.btn,input,select{min-height:44px;touch-action:manipulation}
.game-container,.game,.game-wrap,.game-area,.container{max-width:100%;width:100%;box-sizing:border-box}
@media (max-width:600px){
  body{padding-left:8px!important;padding-right:8px!important}
  h1{font-size:clamp(20px,6vw,30px)!important}
  h2{font-size:clamp(18px,5vw,25px)!important}
  button,.btn{font-size:15px!important;padding:10px 12px!important}
  canvas{display:block;margin:0 auto;max-width:100%!important}
  .game-grid{grid-template-columns:1fr!important}
  .controls{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px!important}
  .controls button{width:100%!important}
}
/* Make the game itself fit the phone viewport rather than forcing desktop width. */
@media (max-width:420px){
  body{padding-left:5px!important;padding-right:5px!important}
  .controls{grid-template-columns:repeat(2,1fr)!important}
}
</style>  <link rel="stylesheet" href="css/mobile-safe.css">
</head>
<body>
<div class="center">
  <div class="panel">
    <img src="assets/bawaxict-logo.png" alt="BAWAX ICT">
    <h2>Opening Community Chat…</h2>
    <p class="muted">Community Chat is free and unlimited and does not require an internet ticket.</p>
    <p><a id="openChat" class="btn btn-primary" href="community-chat.html">Open Community Chat</a></p>
<script>document.getElementById("openChat").click();</script>
  </div>
</div>
<!-- FamilyHub is cloud-hosted. The hotspot itself is not required to host the chat server. -->

</body>
</html>
