<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B2E23">
<meta http-equiv="Cache-Control" content="no-store">
<title>Your Connection | BAWAXICT WiFi</title>
<!--
  MikroTik hotspot status page, rebuilt in the FamilyHub mockup design system.

  IMPORTANT: this file is served by the ROUTER from its HOTSPOT1 html-directory,
  not by Cloudflare Pages. It therefore cannot link css/familyhub-mockup.css --
  the router does not serve that file, and a pre-auth client cannot reach the
  CDN. The tokens below are copied verbatim from familyhub-mockup.css so the
  page matches site/status.html exactly while staying fully self-contained:
  no external CSS, no fonts, no images, no scripts.

  $(...) placeholders are RouterOS hotspot variables, substituted by the router.
  Upload with: /file -> drag into HOTSPOT1/, or via FTP to HOTSPOT1/status.html
-->
<style>
:root{
  --fh-green-900:#0B2E23; --fh-green-700:#175C43; --fh-green-600:#0FA968;
  --fh-green-500:#12B76A; --fh-orange-500:#FF7A2E; --fh-orange-600:#E8690F;
  --fh-radius:16px; --fh-radius-sm:12px; --fh-pill:999px;
  --fh-font:'Plus Jakarta Sans','Segoe UI Variable','Segoe UI',Inter,system-ui,
            -apple-system,'Helvetica Neue',Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--fh-font);
  min-height:100dvh;display:grid;place-items:center;padding:20px;color:#fff;
  background:linear-gradient(160deg,var(--fh-green-900),var(--fh-green-700) 55%,#0c3527);
  position:relative;overflow-x:hidden;-webkit-font-smoothing:antialiased;
  font-size:14px;line-height:1.5;
}
body::before{content:"";position:absolute;inset:0;
  background-image:radial-gradient(circle at 1.5px 1.5px,rgba(255,255,255,.07) 1.5px,transparent 0);
  background-size:30px 30px;pointer-events:none}
a{text-decoration:none;color:inherit}
.wrap{position:relative;width:min(440px,100%);text-align:center}

.wifi-pill{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.12);
  border:1px solid rgba(255,255,255,.18);border-radius:var(--fh-pill);
  padding:7px 15px;font-size:12.5px;font-weight:700;margin-bottom:18px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--fh-green-500);flex:none;
  box-shadow:0 0 0 3px rgba(18,183,106,.18)}

.tick{width:96px;height:96px;border-radius:50%;margin:0 auto 18px;display:grid;place-items:center;
  background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);
  animation:pop .45s cubic-bezier(.2,.9,.3,1.3)}
.tick svg{width:48px;height:48px}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}

h1{font-size:27px;font-weight:800;margin:0 0 8px;letter-spacing:-.4px}
.lead{font-size:14.5px;opacity:.86;line-height:1.55;margin:0 auto 22px;max-width:330px}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:18px}
.stat{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);
  border-radius:var(--fh-radius);padding:13px 8px;min-width:0}
.stat b{display:block;font-size:16px;font-weight:800;line-height:1.25;
  overflow-wrap:anywhere}
.stat span{font-size:11px;opacity:.78}

.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:20px}
.quick a{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);
  border-radius:var(--fh-radius-sm);padding:14px 6px;color:#fff;font-size:11.5px;font-weight:700;
  display:flex;flex-direction:column;align-items:center;gap:6px;transition:.16s;
  min-height:44px;justify-content:center}
.quick a:active{background:rgba(255,255,255,.2)}
.quick .ic{font-size:20px;line-height:1}

.btn{display:flex;align-items:center;justify-content:center;
  width:100%;min-height:52px;padding:15px;border:0;border-radius:var(--fh-pill);
  background:var(--fh-orange-500);color:#fff;font-family:inherit;
  font-size:16px;font-weight:800;cursor:pointer;transition:.16s}
.btn:active{background:var(--fh-orange-600)}
.btn.secondary{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);
  margin-top:10px;font-size:14.5px;min-height:48px}

.foot{font-size:12.5px;opacity:.72;margin-top:20px;line-height:1.6}

@media(max-width:380px){
  h1{font-size:24px}
  .stats{grid-template-columns:1fr 1fr}
  .stat:last-child{grid-column:1 / -1}
}
@media(prefers-reduced-motion:reduce){
  .tick{animation:none}
}
</style>
</head>
<body>

<div class="wrap">
  <div class="wifi-pill"><span class="dot"></span><span>BAWAXICT WiFi</span></div>

  <div class="tick">
    <svg viewBox="0 0 24 24" fill="none" stroke="#12B76A" stroke-width="3"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M20 6L9 17l-5-5"/>
    </svg>
  </div>

  <h1>You're Connected!</h1>
  <p class="lead">Signed in as <b>$(username)</b>.<br>
    More than WiFi &mdash; your digital community.</p>

  <div class="stats">
    <div class="stat"><b>$(uptime)</b><span>online</span></div>
    <div class="stat"><b>$(bytes-in-nice)</b><span>downloaded</span></div>
    <div class="stat"><b>$(bytes-out-nice)</b><span>uploaded</span></div>
  </div>

  <a class="btn" href="https://bawaxict-familyhub2.pages.dev/forum">Enter FamilyHub &rarr;</a>

  <div class="quick" style="margin-top:16px">
    <a href="https://bawaxict-familyhub2.pages.dev/forum"><span class="ic">&#128172;</span>Community</a>
    <a href="https://bawaxict-familyhub2.pages.dev/services"><span class="ic">&#9874;</span>Services</a>
    <a href="https://bawaxict-familyhub2.pages.dev/marketplace"><span class="ic">&#128722;</span>Market</a>
    <a href="https://bawaxict-familyhub2.pages.dev/institute"><span class="ic">&#128218;</span>Learning</a>
    <a href="https://bawaxict-familyhub2.pages.dev/skills"><span class="ic">&#128188;</span>Jobs</a>
    <a href="https://bawaxict-familyhub2.pages.dev/games"><span class="ic">&#127918;</span>Games</a>
  </div>

  <form action="$(link-logout)" method="post">
    <button class="btn secondary" type="submit">Log out</button>
  </form>

  <div class="foot">
    IP $(ip) &middot; Session $(uptime)<br>
    BAWAX ICT Smart Service
  </div>
</div>

</body>
</html>
