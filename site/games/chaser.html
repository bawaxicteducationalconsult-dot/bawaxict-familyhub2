<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta http-equiv="Cache-Control" content="no-store">
<title>BAWAX ICT | Ticket Chaser</title>
<link rel="stylesheet" href="../css/bawaxict.css">
<style>
:root{--g1:#0b6b4f;--g2:#138a67;--o:#f28a19}
body{overflow:hidden}
.arcade-wrap{max-width:520px;margin:0 auto;padding:14px}
.arcade-top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 2px 12px}
.arcade-top a{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:800;color:var(--green)}
.hud{display:flex;justify-content:space-between;gap:10px;margin-bottom:10px}
.hud .box{flex:1;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 14px;text-align:center;box-shadow:var(--shadow)}
.hud .box span{display:block;font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.hud .box strong{display:block;font-size:20px;color:var(--dark);margin-top:2px}
#stage{width:100%;aspect-ratio:3/4;max-height:70vh;background:linear-gradient(180deg,#eaf6ef,#dff2e7);border-radius:22px;border:1px solid var(--line);box-shadow:var(--shadow);display:block;touch-action:none}
.overlay{position:fixed;inset:0;background:rgba(7,59,44,.55);display:none;align-items:center;justify-content:center;padding:20px;z-index:9}
.overlay.show{display:flex}
.card{background:#fff;border-radius:24px;padding:26px;max-width:340px;width:100%;text-align:center;box-shadow:var(--shadow)}
.card h2{margin:0 0 6px}
.card .score{font-size:44px;font-weight:900;color:var(--green);margin:10px 0}
.btnrow{display:flex;gap:8px;margin-top:16px}
.btnrow .btn{flex:1}
.hint{text-align:center;color:var(--muted);font-size:11px;margin-top:10px}
</style>
<style>
/* BAWAX Mobile Game Zone enhancements */
html,body{width:100%;max-width:100%;overflow-x:hidden}
body{-webkit-text-size-adjust:100%;touch-action:manipulation}
img,canvas,svg,video{max-width:100%;height:auto}
button,.btn,input,select{min-height:44px;touch-action:manipulation}
.game-container,.game,.game-wrap,.game-area,.container{max-width:100%;width:100%;box-sizing:border-box}
@media (max-width:600px){
  body{padding-left:8px!important;padding-right:8px!important}
  h1{font-size:clamp(20px,6vw,30px)!important}
  h2{font-size:clamp(18px,5vw,25px)!important}
  button,.btn{font-size:15px!important;padding:10px 12px!important}
  canvas{display:block;margin:0 auto;max-width:100%!important}
  .game-grid{grid-template-columns:1fr!important}
  .controls{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px!important}
  .controls button{width:100%!important}
}
/* Make the game itself fit the phone viewport rather than forcing desktop width. */
@media (max-width:420px){
  body{padding-left:5px!important;padding-right:5px!important}
  .controls{grid-template-columns:repeat(2,1fr)!important}
}
</style>  <link rel="stylesheet" href="css/mobile-safe.css">
</head>
<body>
<div class="arcade-wrap">
<div class="arcade-top">
<a href="../games.html">← Arcade</a>
<a class="brand" href="../login.html"><img src="../assets/bawaxict-logo.png" alt="BAWAX ICT" style="width:120px"></a>
<span style="width:60px"></span>
</div>

<div class="hud">
<div class="box"><span>Score</span><strong id="score">0</strong></div>
<div class="box"><span>Best</span><strong id="best">0</strong></div>
<div class="box"><span>Time</span><strong id="time">60</strong></div>
</div>

<canvas id="stage"></canvas>
<p class="hint">Drag / arrow keys to move the basket. Catch the 🎟️ and 🪙 — avoid the ❌.</p>
</div>

<div class="overlay show" id="startOverlay">
<div class="card">
<h2>🪙 Ticket Chaser</h2>
<p class="muted">Catch as many tickets and coins as you can in 60 seconds. Miss the ❌ symbols — those cost you points.</p>
<button class="btn btn-primary" id="startBtn">Start Game</button>
</div>
</div>

<div class="overlay" id="endOverlay">
<div class="card">
<h2>Time's up!</h2>
<div class="score" id="finalScore">0</div>
<p class="muted" id="endMsg">Nice catching.</p>
<div class="btnrow">
<button class="btn btn-outline" id="againBtn">Play Again</button>
<a class="btn btn-primary" href="../tickets.html">Get a Ticket</a>
</div>
</div>
</div>

<script>
(function(){
var canvas=document.getElementById('stage');
var ctx=canvas.getContext('2d');
var W,H,scale;

function resize(){
  var rect=canvas.getBoundingClientRect();
  scale=window.devicePixelRatio||1;
  W=rect.width; H=rect.height;
  canvas.width=W*scale; canvas.height=H*scale;
  ctx.setTransform(scale,0,0,scale,0,0);
}
window.addEventListener('resize',resize);

var basket={w:70,h:44,x:0,y:0};
var items=[]; var particles=[];
var score=0, timeLeft=60, running=false, spawnTimer=0, spawnInterval=850, elapsed=0;
var best=parseInt(localStorage.getItem('bawax_chaser_best')||'0',10)||0;
document.getElementById('best').textContent=best;

var GOOD=[{ch:'🎟️',v:10},{ch:'🪙',v:5}];
var BAD={ch:'❌',v:-8};

function reset(){
  score=0; timeLeft=60; items=[]; particles=[]; spawnTimer=0; spawnInterval=850; elapsed=0;
  basket.x=W/2-basket.w/2; basket.y=H-basket.h-14;
  document.getElementById('score').textContent=0;
  document.getElementById('time').textContent=60;
}

function spawnItem(){
  var isBad=Math.random()<0.22;
  var def=isBad?BAD:GOOD[Math.floor(Math.random()*GOOD.length)];
  items.push({
    x:Math.random()*(W-30)+15,
    y:-20,
    r:16,
    vy:110+Math.random()*70+ (60-timeLeft)*1.2,
    ch:def.ch, v:def.v, bad:isBad
  });
}

function pop(x,y,color){
  for(var i=0;i<10;i++){
    particles.push({x:x,y:y,vx:(Math.random()-0.5)*160,vy:(Math.random()-0.9)*160,life:0.5,color:color});
  }
}

var keys={};
window.addEventListener('keydown',function(e){keys[e.key]=true;});
window.addEventListener('keyup',function(e){keys[e.key]=false;});

function pointerMove(clientX){
  var rect=canvas.getBoundingClientRect();
  var x=clientX-rect.left;
  basket.x=Math.max(0,Math.min(W-basket.w,x-basket.w/2));
}
canvas.addEventListener('mousemove',function(e){ if(e.buttons===1) pointerMove(e.clientX); });
canvas.addEventListener('touchmove',function(e){ e.preventDefault(); pointerMove(e.touches[0].clientX); },{passive:false});
canvas.addEventListener('touchstart',function(e){ pointerMove(e.touches[0].clientX); },{passive:false});

var last=performance.now();
function loop(now){
  var dt=Math.min(0.05,(now-last)/1000); last=now;
  if(running){
    elapsed+=dt;
    if(keys['ArrowLeft']) basket.x-=320*dt;
    if(keys['ArrowRight']) basket.x+=320*dt;
    basket.x=Math.max(0,Math.min(W-basket.w,basket.x));

    spawnTimer+=dt*1000;
    var curInterval=Math.max(320,spawnInterval-elapsed*6);
    if(spawnTimer>curInterval){ spawnTimer=0; spawnItem(); }

    for(var i=items.length-1;i>=0;i--){
      var it=items[i];
      it.y+=it.vy*dt;
      var caught = it.y+it.r>basket.y && it.y-it.r<basket.y+basket.h &&
                   it.x>basket.x && it.x<basket.x+basket.w;
      if(caught){
        score+=it.v;
        pop(it.x,it.y, it.bad?'#b7372d':'#0b6b4f');
        items.splice(i,1);
        if(score<0) score=0;
        document.getElementById('score').textContent=score;
        continue;
      }
      if(it.y>H+30) items.splice(i,1);
    }

    for(var p=particles.length-1;p>=0;p--){
      var pt=particles[p];
      pt.x+=pt.vx*dt; pt.y+=pt.vy*dt; pt.vy+=300*dt; pt.life-=dt;
      if(pt.life<=0) particles.splice(p,1);
    }

    timeLeft-=dt;
    document.getElementById('time').textContent=Math.max(0,Math.ceil(timeLeft));
    if(timeLeft<=0){ endGame(); }
  }

  draw();
  requestAnimationFrame(loop);
}

function draw(){
  ctx.clearRect(0,0,W,H);
  // ground line
  ctx.strokeStyle='rgba(11,107,79,0.18)';
  ctx.lineWidth=2;
  ctx.beginPath();
  ctx.moveTo(0,H-8); ctx.lineTo(W,H-8);
  ctx.stroke();

  // basket
  ctx.save();
  ctx.translate(basket.x,basket.y);
  var grad=ctx.createLinearGradient(0,0,0,basket.h);
  grad.addColorStop(0,'#138a67'); grad.addColorStop(1,'#0b6b4f');
  ctx.fillStyle=grad;
  ctx.beginPath();
  if(ctx.roundRect) ctx.roundRect(0,10,basket.w,basket.h-10,12); else ctx.rect(0,10,basket.w,basket.h-10);
  ctx.fill();
  ctx.fillStyle='#f28a19';
  ctx.fillRect(0,6,basket.w,7);
  ctx.restore();

  // items
  ctx.font='26px Arial';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  items.forEach(function(it){ ctx.fillText(it.ch,it.x,it.y); });

  // particles
  particles.forEach(function(pt){
    ctx.globalAlpha=Math.max(0,pt.life/0.5);
    ctx.fillStyle=pt.color;
    ctx.beginPath(); ctx.arc(pt.x,pt.y,3,0,Math.PI*2); ctx.fill();
    ctx.globalAlpha=1;
  });
}

function startGame(){
  resize(); reset();
  running=true;
  document.getElementById('startOverlay').classList.remove('show');
  document.getElementById('endOverlay').classList.remove('show');
}

function endGame(){
  running=false;
  if(score>best){ best=score; localStorage.setItem('bawax_chaser_best',best); }
  document.getElementById('best').textContent=best;
  document.getElementById('finalScore').textContent=score;
  var msg = score>=250 ? 'Champion-level catching!' : score>=120 ? 'Solid run — try to beat it.' : 'Give it another go!';
  document.getElementById('endMsg').textContent=msg;
  document.getElementById('endOverlay').classList.add('show');
}

document.getElementById('startBtn').addEventListener('click',startGame);
document.getElementById('againBtn').addEventListener('click',startGame);

resize();
basket.x=W/2-basket.w/2; basket.y=H-basket.h-14;
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
