<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BAWAX Brick Breaker</title>
<link rel="stylesheet" href="../css/bawaxict.css"><style>
body{background:#101827}.wrap{max-width:760px;margin:auto;padding:16px}.panel{background:#fff;border-radius:22px;padding:14px;box-shadow:var(--shadow)}.head{display:flex;justify-content:space-between}.score{font-weight:900;color:#0b6b4f}.arena{display:block;width:min(94vw,640px);height:auto;aspect-ratio:4/3;background:#0d1725;border-radius:16px;margin:12px auto;touch-action:none}.actions{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}.actions button{border:1px solid #cbd5e1;border-radius:10px;background:#f8fafc;padding:11px 14px;font-weight:800}.note{text-align:center;color:#64748b;font-size:12px}
.hud{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
.badge{background:#eef2ff;color:#3730a3;border:1px solid #c7d2fe;border-radius:999px;padding:4px 10px;font-weight:800;font-size:12px}
.mission{text-align:center;color:#3730a3;font-weight:700;font-size:13px;margin:4px 0 0}
</style><style>
/* BAWAX Mobile Game Zone enhancements */
html,body{width:100%;max-width:100%;overflow-x:hidden}
body{-webkit-text-size-adjust:100%;touch-action:manipulation}
img,canvas,svg,video{max-width:100%;height:auto}
button,.btn,input,select{min-height:44px;touch-action:manipulation}
.game-container,.game,.game-wrap,.game-area,.container{max-width:100%;width:100%;box-sizing:border-box}
@media (max-width:600px){
  body{padding-left:8px!important;padding-right:8px!important}
  h1{font-size:clamp(20px,6vw,30px)!important}
  h2{font-size:clamp(18px,5vw,25px)!important}
  button,.btn{font-size:15px!important;padding:10px 12px!important}
  canvas{display:block;margin:0 auto;max-width:100%!important}
  .game-grid{grid-template-columns:1fr!important}
  .controls{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px!important}
  .controls button{width:100%!important}
}
@media (max-width:420px){
  body{padding-left:5px!important;padding-right:5px!important}
  .controls{grid-template-columns:repeat(2,1fr)!important}
}
</style>  <link rel="stylesheet" href="css/mobile-safe.css">
</head><body><div class="page"><div class="topbar"><a class="brand" href="../games.html"><img src="../assets/bawaxict-logo.png" alt="BAWAX ICT"></a><div class="status-pill"><span class="dot"></span>No ticket needed</div></div>
<div class="wrap"><div class="panel">
<div class="head"><div><h1 style="margin:0">🧱 BAWAX Brick Breaker</h1><p style="margin:3px 0;color:#64748b">Drag to slide the paddle, clear every brick.</p></div><div class="score">Score: <span id="score">0</span></div></div>
<div class="hud"><span class="badge" id="stageBadge">Stage 1</span><span class="badge" id="livesBadge">Lives: 3</span><span class="badge" id="bestBadge">Best: 0</span></div>
<p class="mission" id="mission">Clear all the bricks to advance!</p>
<canvas id="c" class="arena" width="640" height="480"></canvas>
<div class="actions"><button id="start">Start / Restart</button><button id="pause">Pause</button><button onclick="location.href='../games.html'">Game Zone</button></div>
<p class="note">Drag / move the mouse to steer the paddle. Tap, click, or press Space to launch the ball.</p>
</div></div></div>
<script>
const c=document.getElementById('c'),g=c.getContext('2d');
const scoreEl=document.getElementById('score'),stageBadge=document.getElementById('stageBadge'),livesBadge=document.getElementById('livesBadge'),bestBadge=document.getElementById('bestBadge'),missionEl=document.getElementById('mission'),pauseBtn=document.getElementById('pause');
const W=640,H=480;
let paddle,ball,bricks,score,stage,lives,run=false,paused=false,launched=false,timer,keys={};
let best=parseInt(localStorage.getItem('bawax_brick_best')||'0',10);
bestBadge.textContent='Best: '+best;

function paddleWidthFor(stage){return Math.max(72,104-stage*2.5)}
function ballSpeedFor(stage){return Math.min(7.6,4.2+stage*0.28)}

function buildBricks(stage){
  const rows=Math.min(3+stage,7),cols=8;
  const margin=24,gap=6,top=48;
  const bw=(W-margin*2-(cols-1)*gap)/cols,bh=16;
  const palette=['#ef4444','#f59e0b','#eab308','#22c55e','#06b6d4','#6366f1','#a855f7'];
  const arr=[];
  for(let r=0;r<rows;r++){
    for(let cIdx=0;cIdx<cols;cIdx++){
      const tough = stage>=4 && ((r+cIdx)%5===0);
      arr.push({
        x:margin+cIdx*(bw+gap), y:top+r*(bh+gap), w:bw, h:bh,
        color:palette[r%palette.length], hp: tough?2:1, alive:true
      });
    }
  }
  return arr;
}
function resetBallOnPaddle(){
  launched=false;
  ball={x:paddle.x+paddle.w/2,y:paddle.y-9,r:7,vx:0,vy:0};
}
function newPaddle(stage){
  const w=paddleWidthFor(stage);
  return {x:W/2-w/2,y:H-26,w,h:12,speed:6.4};
}
function startStage(s){
  stage=s;
  paddle=newPaddle(stage);
  bricks=buildBricks(stage);
  resetBallOnPaddle();
  updateHUD();
}
function resetGame(){
  score=0;stage=1;lives=3;run=true;paused=false;
  pauseBtn.textContent='Pause';
  scoreEl.textContent=score;
  startStage(1);
}
function updateHUD(){
  stageBadge.textContent='Stage '+stage;
  livesBadge.textContent='Lives: '+lives;
  const remaining=bricks.filter(b=>b.alive).length;
  if(!run) missionEl.textContent='Score '+score+' • Stage '+stage+' — press Start';
  else if(paused) missionEl.textContent='Paused — press Continue';
  else if(!launched) missionEl.textContent='Tap or press Space to launch the ball!';
  else missionEl.textContent=remaining+' bricks left — clear them all!';
}
function launch(){
  if(!run||paused||launched)return;
  launched=true;
  const speed=ballSpeedFor(stage);
  const angle=-Math.PI/2 + (Math.random()*0.5-0.25);
  ball.vx=Math.cos(angle)*speed;
  ball.vy=Math.sin(angle)*speed;
  updateHUD();
}
function loseLife(){
  lives--;
  if(lives<=0){
    run=false;
    if(score>best){best=score;localStorage.setItem('bawax_brick_best',best);bestBadge.textContent='Best: '+best;}
    updateHUD();
    return;
  }
  resetBallOnPaddle();
  updateHUD();
}
function stageClear(){
  run=false;
  missionEl.textContent='Stage '+stage+' Clear!';
  lives=Math.min(5,lives+1);
  setTimeout(()=>{
    run=true;
    startStage(stage+1);
  },900);
}
function update(dt){
  const sx=(keys.ArrowRight||keys.d?1:0)-(keys.ArrowLeft||keys.a?1:0);
  paddle.x=Math.max(6,Math.min(W-6-paddle.w,paddle.x+sx*paddle.speed*dt/16));
  if(!launched){
    ball.x=paddle.x+paddle.w/2;ball.y=paddle.y-9;
    return;
  }
  ball.x+=ball.vx*dt/16;ball.y+=ball.vy*dt/16;
  if(ball.x-ball.r<4){ball.x=4+ball.r;ball.vx*=-1}
  if(ball.x+ball.r>W-4){ball.x=W-4-ball.r;ball.vx*=-1}
  if(ball.y-ball.r<4){ball.y=4+ball.r;ball.vy*=-1}
  if(ball.y+ball.r>H+20){loseLife();return}
  if(ball.y+ball.r>=paddle.y && ball.y-ball.r<=paddle.y+paddle.h && ball.x>=paddle.x && ball.x<=paddle.x+paddle.w && ball.vy>0){
    const hit=(ball.x-(paddle.x+paddle.w/2))/(paddle.w/2);
    const speed=Math.hypot(ball.vx,ball.vy);
    const angle=hit*(Math.PI/3)-Math.PI/2;
    ball.vx=Math.cos(angle)*speed;
    ball.vy=Math.sin(angle)*speed;
    ball.y=paddle.y-ball.r-1;
  }
  for(const b of bricks){
    if(!b.alive)continue;
    if(ball.x+ball.r>b.x && ball.x-ball.r<b.x+b.w && ball.y+ball.r>b.y && ball.y-ball.r<b.y+b.h){
      b.hp--;
      if(b.hp<=0){b.alive=false;score+=10;}else{score+=4;}
      scoreEl.textContent=score;
      const overlapX=Math.min(ball.x+ball.r-b.x, b.x+b.w-(ball.x-ball.r));
      const overlapY=Math.min(ball.y+ball.r-b.y, b.y+b.h-(ball.y-ball.r));
      if(overlapX<overlapY) ball.vx*=-1; else ball.vy*=-1;
      break;
    }
  }
  if(bricks.every(b=>!b.alive)) stageClear();
}
function draw(){
  g.fillStyle='#0d1725';g.fillRect(0,0,W,H);
  g.strokeStyle='#1e3147';
  for(let x0=0;x0<W;x0+=40){g.beginPath();g.moveTo(x0,0);g.lineTo(x0,H);g.stroke()}
  for(let y0=0;y0<H;y0+=40){g.beginPath();g.moveTo(0,y0);g.lineTo(W,y0);g.stroke()}
  bricks.forEach(b=>{
    if(!b.alive)return;
    g.fillStyle=b.color;
    g.globalAlpha=b.hp>1?1:0.92;
    g.fillRect(b.x,b.y,b.w,b.h);
    g.globalAlpha=1;
    if(b.hp>1){g.strokeStyle='rgba(255,255,255,.7)';g.strokeRect(b.x+1.5,b.y+1.5,b.w-3,b.h-3)}
  });
  g.fillStyle='#e2e8f0';
  g.beginPath();g.roundRect?g.roundRect(paddle.x,paddle.y,paddle.w,paddle.h,6):g.rect(paddle.x,paddle.y,paddle.w,paddle.h);g.fill();
  g.fillStyle='#f59e0b';
  g.beginPath();g.arc(ball.x,ball.y,ball.r,0,7);g.fill();
  if(!run||paused){
    g.fillStyle='rgba(0,0,0,.4)';g.fillRect(0,0,W,H);
    g.fillStyle='#fff';g.font='bold 24px system-ui';g.textAlign='center';
    let msg='Press Start to play';
    if(paused) msg='Paused';
    else if(lives<=0) msg='Game Over — Score '+score+' — press Start';
    else if(stage>1&&bricks.every(b=>!b.alive)) msg='Stage '+stage+' Clear!';
    g.fillText(msg,W/2,H/2);
  }
}
function loop(ts){
  const dt = loop.last ? Math.min(40,ts-loop.last) : 16;
  loop.last=ts;
  if(run && !paused) update(dt);
  draw();
  requestAnimationFrame(loop);
}
function aimAt(px,py){
  const r=c.getBoundingClientRect();
  const x=(px-r.left)*c.width/r.width;
  paddle.x=Math.max(6,Math.min(W-6-paddle.w,x-paddle.w/2));
}
c.addEventListener('pointermove',e=>{ if(paddle) aimAt(e.clientX,e.clientY) });
c.addEventListener('pointerdown',e=>{ if(paddle) aimAt(e.clientX,e.clientY); launch(); });
document.addEventListener('keydown',e=>{
  keys[e.key]=true;
  if(e.key===' '){e.preventDefault();launch();}
});
document.addEventListener('keyup',e=>keys[e.key]=false);
document.getElementById('start').onclick=resetGame;
pauseBtn.onclick=()=>{
  if(!run) return;
  paused=!paused;
  pauseBtn.textContent=paused?'Continue':'Pause';
  updateHUD();
};

paddle=newPaddle(1);stage=1;lives=3;score=0;bricks=buildBricks(1);resetBallOnPaddle();run=false;
updateHUD();
requestAnimationFrame(loop);
</script></body></html>
