<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BAWAX Bubble Pop</title>
<link rel="stylesheet" href="../css/bawaxict.css"><style>
body{background:#0b1330}.wrap{max-width:720px;margin:auto;padding:16px}.panel{background:#fff;border-radius:22px;padding:14px;box-shadow:var(--shadow)}
.head{display:flex;justify-content:space-between;align-items:center;gap:10px}.score{font-weight:900;color:#3730a3}
.board{width:min(92vw,480px);aspect-ratio:3/4;margin:12px auto;background:#111a3d;border-radius:16px;display:block;touch-action:none}
.actions{display:flex;justify-content:center;gap:8px;margin-top:10px;flex-wrap:wrap}.actions button{border:1px solid #cbd5e1;border-radius:10px;background:#f8fafc;padding:12px 14px;font-weight:800}
.note{text-align:center;color:#64748b;font-size:12px}
.hud{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
.badge{background:#eef2ff;color:#3730a3;border:1px solid #c7d2fe;border-radius:999px;padding:4px 10px;font-weight:800;font-size:12px}
.mission{text-align:center;color:#3730a3;font-weight:700;font-size:13px;margin:4px 0 0}
</style><style>
/* BAWAX Mobile Game Zone enhancements */
html,body{width:100%;max-width:100%;overflow-x:hidden}
body{-webkit-text-size-adjust:100%;touch-action:manipulation}
img,canvas,svg,video{max-width:100%;height:auto}
button,.btn,input,select{min-height:44px;touch-action:manipulation}
.game-container,.game,.game-wrap,.game-area,.container{max-width:100%;width:100%;box-sizing:border-box}
@media (max-width:600px){
  body{padding-left:8px!important;padding-right:8px!important}
  h1{font-size:clamp(20px,6vw,30px)!important}
  h2{font-size:clamp(18px,5vw,25px)!important}
  button,.btn{font-size:15px!important;padding:10px 12px!important}
  canvas{display:block;margin:0 auto;max-width:100%!important}
}
@media (max-width:420px){
  body{padding-left:5px!important;padding-right:5px!important}
}
</style>  <link rel="stylesheet" href="css/mobile-safe.css">
</head><body><div class="page"><div class="topbar"><a class="brand" href="../games.html"><img src="../assets/bawaxict-logo.png" alt="BAWAX ICT"></a><div class="status-pill"><span class="dot"></span>No ticket needed</div></div>
<div class="wrap"><div class="panel">
<div class="head"><div><h1 style="margin:0">🫧 BAWAX Bubble Pop</h1><p style="margin:3px 0;color:#64748b">Aim, shoot, match 3+ to pop the bubbles.</p></div><div class="score">Score: <span id="score">0</span></div></div>
<div class="hud"><span class="badge" id="stageBadge">Stage 1</span><span class="badge" id="bestBadge">Best: 0</span></div>
<p class="mission" id="mission">Clear the board to advance!</p>
<canvas id="c" class="board" width="480" height="640"></canvas>
<div class="actions"><button id="start">Start / Restart</button><button id="pause">Pause</button><button onclick="location.href='../games.html'">Game Zone</button></div>
<p class="note">Move / drag to aim, tap or click to shoot. Match 3 or more of the same color to pop them.</p>
</div></div></div>
<script>
const cv=document.getElementById('c'),g=cv.getContext('2d');
const W=480,H=640;
const scoreEl=document.getElementById('score'),stageBadge=document.getElementById('stageBadge'),bestBadge=document.getElementById('bestBadge'),missionEl=document.getElementById('mission'),pauseBtn=document.getElementById('pause');
let best=parseInt(localStorage.getItem('bawax_bubble_best')||'0',10);
bestBadge.textContent='Best: '+best;

const COLS=8, CELL=W/COLS, ROWH=CELL*0.87, RADIUS=CELL/2-3, TOP=30, ROWS_MAX=13, DANGER_ROW=10;
const PALETTE=['#ef4444','#f59e0b','#22c55e','#3b82f6','#a855f7','#ec4899'];

let grid, score, stage, colorsCount, shotsFired, pushEvery, run=false, paused=false, gameOver=false, stageClearedFlag=false;
let shooter, moving=null, aimAngle=-Math.PI/2;

function colsInRow(r){ return (r%2===0)? COLS : COLS-1; }
function cellX(r,c){ return c*CELL + RADIUS + 3 + (r%2? CELL/2:0); }
function cellY(r){ return r*ROWH + TOP + RADIUS; }
function neighbors(r,c){
  if(r%2===0) return [[r,c-1],[r,c+1],[r-1,c-1],[r-1,c],[r+1,c-1],[r+1,c]];
  return [[r,c-1],[r,c+1],[r-1,c],[r-1,c+1],[r+1,c],[r+1,c+1]];
}
function emptyGrid(){
  const g2=[];
  for(let r=0;r<ROWS_MAX;r++){ g2.push(new Array(COLS).fill(null)); }
  return g2;
}
function randomColor(){ return Math.floor(Math.random()*colorsCount); }
function fillInitialRows(rows){
  for(let r=0;r<rows;r++){
    const n=colsInRow(r);
    for(let c=0;c<n;c++) grid[r][c]=randomColor();
  }
}
function stageConfig(s){
  return {
    rows: Math.min(4+Math.floor(s*0.6), 7),
    colors: Math.min(3+Math.floor(s/2), PALETTE.length),
    pushEvery: Math.max(4, 8-s)
  };
}
function startStage(s){
  stage=s;
  const cfg=stageConfig(s);
  colorsCount=cfg.colors; pushEvery=cfg.pushEvery; shotsFired=0;
  grid=emptyGrid();
  fillInitialRows(cfg.rows);
  moving=null; gameOver=false; stageClearedFlag=false;
  shooter={x:W/2,y:H-28,color:randomColor(),next:randomColor()};
  updateHUD();
}
function resetGame(){
  score=0; scoreEl.textContent=0; run=true; paused=false;
  pauseBtn.textContent='Pause';
  startStage(1);
}
function updateHUD(){
  stageBadge.textContent='Stage '+stage;
  const count=grid.reduce((a,row)=>a+row.filter(v=>v!==null).length,0);
  if(gameOver) missionEl.textContent='Game Over — Score '+score+' • press Start';
  else if(stageClearedFlag) missionEl.textContent='Stage '+stage+' Clear!';
  else if(paused) missionEl.textContent='Paused — press Continue';
  else missionEl.textContent=count+' bubbles left — clear the board!';
}
function findGroup(r,c,color){
  const seen=new Set(), stack=[[r,c]], group=[];
  seen.add(r+','+c);
  while(stack.length){
    const [cr,cc]=stack.pop();
    if(grid[cr]===undefined||grid[cr][cc]===undefined) continue;
    if(grid[cr][cc]!==color) continue;
    group.push([cr,cc]);
    neighbors(cr,cc).forEach(([nr,nc])=>{
      const key=nr+','+nc;
      if(!seen.has(key) && nr>=0 && nr<ROWS_MAX && nc>=0 && nc<colsInRow(nr) && grid[nr] && grid[nr][nc]===color){
        seen.add(key); stack.push([nr,nc]);
      }
    });
  }
  return group;
}
function dropFloating(){
  const connected=new Set();
  const stack=[];
  for(let c=0;c<colsInRow(0);c++){ if(grid[0][c]!==null){ stack.push([0,c]); connected.add('0,'+c); } }
  while(stack.length){
    const [r,c]=stack.pop();
    neighbors(r,c).forEach(([nr,nc])=>{
      const key=nr+','+nc;
      if(!connected.has(key) && nr>=0 && nr<ROWS_MAX && nc>=0 && nc<colsInRow(nr) && grid[nr] && grid[nr][nc]!==null){
        connected.add(key); stack.push([nr,nc]);
      }
    });
  }
  let dropped=0;
  for(let r=0;r<ROWS_MAX;r++){
    for(let c=0;c<colsInRow(r);c++){
      if(grid[r][c]!==null && !connected.has(r+','+c)){ grid[r][c]=null; dropped++; }
    }
  }
  if(dropped) score+=dropped*15;
}
function nearestEmptyCell(x,y){
  let best=null, bestDist=Infinity;
  for(let r=0;r<ROWS_MAX;r++){
    for(let c=0;c<colsInRow(r);c++){
      if(grid[r][c]!==null) continue;
      const cx=cellX(r,c), cy=cellY(r);
      const d=(cx-x)*(cx-x)+(cy-y)*(cy-y);
      if(d<bestDist){bestDist=d; best={r,c};}
    }
  }
  return best;
}
function attachMoving(){
  const spot=nearestEmptyCell(moving.x,moving.y);
  if(!spot){ moving=null; return; }
  grid[spot.r][spot.c]=moving.color;
  const group=findGroup(spot.r,spot.c,moving.color);
  if(group.length>=3){
    group.forEach(([r,c])=>grid[r][c]=null);
    score+=group.length*10;
    dropFloating();
  }
  scoreEl.textContent=score;
  moving=null;
  shooter.color=shooter.next; shooter.next=randomColor();
  if(spot.r>=DANGER_ROW){ endGame(); return; }
  const total=grid.reduce((a,row)=>a+row.filter(v=>v!==null).length,0);
  if(total===0){ clearStage(); return; }
  updateHUD();
}
function pushRow(){
  for(let r=ROWS_MAX-1;r>0;r--){
    for(let c=0;c<COLS;c++) grid[r][c]=grid[r-1]!==undefined?grid[r-1][c]:null;
  }
  const n=colsInRow(0);
  for(let c=0;c<COLS;c++) grid[0][c]= c<n ? randomColor() : null;
  for(let r=0;r<ROWS_MAX;r++){
    for(let c=colsInRow(r);c<COLS;c++) grid[r][c]=null;
  }
  for(let r=DANGER_ROW;r<ROWS_MAX;r++){
    if(grid[r].some(v=>v!==null)){ endGame(); return; }
  }
}
function clearStage(){
  stageClearedFlag=true; run=false;
  updateHUD();
  setTimeout(()=>{ if(!gameOver){ run=true; startStage(stage+1); } },900);
}
function endGame(){
  gameOver=true; run=false;
  if(score>best){ best=score; localStorage.setItem('bawax_bubble_best',best); bestBadge.textContent='Best: '+best; }
  updateHUD();
}
function fire(){
  if(!run||paused||moving||gameOver||stageClearedFlag) return;
  const speed=11;
  moving={x:shooter.x,y:shooter.y,vx:Math.cos(aimAngle)*speed,vy:Math.sin(aimAngle)*speed,color:shooter.color};
  shotsFired++;
  if(shotsFired%pushEvery===0) pushRow();
}
function updateAimFromPointer(px,py){
  const r=cv.getBoundingClientRect();
  const x=(px-r.left)*cv.width/r.width, y=(py-r.top)*cv.height/r.height;
  let ang=Math.atan2(y-shooter.y, x-shooter.x);
  if(ang> -0.15) ang=-0.15; if(ang< -Math.PI+0.15) ang=-Math.PI+0.15;
  aimAngle=ang;
}
function update(){
  if(moving){
    moving.x+=moving.vx; moving.y+=moving.vy;
    if(moving.x-RADIUS<3){moving.x=3+RADIUS;moving.vx*=-1}
    if(moving.x+RADIUS>W-3){moving.x=W-3-RADIUS;moving.vx*=-1}
    if(moving.y-RADIUS<=TOP-RADIUS+4){ attachMoving(); return; }
    for(let r=0;r<ROWS_MAX;r++){
      for(let c=0;c<colsInRow(r);c++){
        if(grid[r][c]===null) continue;
        const cx=cellX(r,c), cy=cellY(r);
        const dx=moving.x-cx, dy=moving.y-cy;
        if(Math.hypot(dx,dy) < RADIUS*2*0.96){ attachMoving(); return; }
      }
    }
  }
}
function draw(){
  g.fillStyle='#111a3d'; g.fillRect(0,0,W,H);
  g.strokeStyle='rgba(239,68,68,.35)';
  g.beginPath(); g.moveTo(0,cellY(DANGER_ROW)+RADIUS); g.lineTo(W,cellY(DANGER_ROW)+RADIUS); g.stroke();
  for(let r=0;r<ROWS_MAX;r++){
    for(let c=0;c<colsInRow(r);c++){
      const v=grid[r][c];
      if(v===null) continue;
      g.fillStyle=PALETTE[v];
      g.beginPath(); g.arc(cellX(r,c),cellY(r),RADIUS,0,7); g.fill();
      g.strokeStyle='rgba(255,255,255,.25)'; g.stroke();
    }
  }
  if(moving){
    g.fillStyle=PALETTE[moving.color];
    g.beginPath(); g.arc(moving.x,moving.y,RADIUS,0,7); g.fill();
  }
  if(run && !paused && !moving && !gameOver && !stageClearedFlag){
    g.strokeStyle='rgba(255,255,255,.5)'; g.setLineDash([6,6]);
    g.beginPath(); g.moveTo(shooter.x,shooter.y);
    g.lineTo(shooter.x+Math.cos(aimAngle)*140, shooter.y+Math.sin(aimAngle)*140);
    g.stroke(); g.setLineDash([]);
  }
  if(shooter){
    g.fillStyle=PALETTE[shooter.color];
    g.beginPath(); g.arc(shooter.x,shooter.y,RADIUS+2,0,7); g.fill();
    g.fillStyle='#fff'; g.font='bold 11px system-ui'; g.textAlign='center';
    g.fillText('NEXT',shooter.x-70,shooter.y+4);
    g.fillStyle=PALETTE[shooter.next];
    g.beginPath(); g.arc(shooter.x-70,shooter.y+16,RADIUS*0.6,0,7); g.fill();
  }
  if(!run||paused){
    g.fillStyle='rgba(0,0,0,.4)'; g.fillRect(0,0,W,H);
    g.fillStyle='#fff'; g.font='bold 22px system-ui'; g.textAlign='center';
    let msg='Press Start to play';
    if(gameOver) msg='Game Over — press Start';
    else if(stageClearedFlag) msg='Stage '+stage+' Clear!';
    else if(paused) msg='Paused';
    g.fillText(msg,W/2,H/2);
  }
  requestAnimationFrame(loop);
}
function loop(){
  if(run && !paused) update();
  draw();
}
cv.addEventListener('pointermove',e=>{ if(shooter) updateAimFromPointer(e.clientX,e.clientY) });
cv.addEventListener('pointerdown',e=>{ if(shooter) updateAimFromPointer(e.clientX,e.clientY); fire(); });
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft'){ aimAngle=Math.max(-Math.PI+0.15,aimAngle-0.08); }
  if(e.key==='ArrowRight'){ aimAngle=Math.min(-0.15,aimAngle+0.08); }
  if(e.key===' '){ e.preventDefault(); fire(); }
});
document.getElementById('start').onclick=resetGame;
pauseBtn.onclick=()=>{
  if(!run) return;
  paused=!paused;
  pauseBtn.textContent=paused?'Continue':'Pause';
  updateHUD();
};
stage=1; score=0; colorsCount=3; pushEvery=8; grid=emptyGrid(); fillInitialRows(4);
shooter={x:W/2,y:H-28,color:randomColor(),next:randomColor()};
updateHUD();
requestAnimationFrame(loop);
</script></body></html>
