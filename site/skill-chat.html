<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Skill Chat | BAWAX ICT</title>
<link rel="stylesheet" href="css/bawaxict.css">
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f8f6;font-family:Inter,system-ui,sans-serif}
.page{max-width:1180px;margin:0 auto;padding:0 18px 30px}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:16px 0;border-bottom:1px solid #e2ebe6;margin-bottom:16px}
.topbar .brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:#073b2c;font-weight:900;font-size:18px}
.topbar .brand img{height:44px}
.topbar .btn{text-decoration:none;padding:9px 18px;border-radius:9px;font-weight:700;font-size:13px;background:#073b2c;color:#fff}
.warning{background:#fff7e9;border:1px solid #f7d49b;color:#775015;padding:12px 16px;border-radius:10px;margin-bottom:16px;font-size:13px}
.owner-box{background:#fff;border-radius:14px;padding:18px 20px;margin-bottom:16px;border:1px solid #e2ebe6}
.owner-box h2{margin:0;font-size:20px;color:#073b2c}
.client-area{background:#fff;border-radius:14px;border:1px solid #e2ebe6;padding:18px 20px;margin-bottom:16px}
.client-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-top:12px}
.client-item{background:#f5f8f6;border-radius:10px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center}
.client-item .name{font-weight:700;font-size:13px}
.chat-btn{background:#075e54;color:#fff;border:0;border-radius:999px;padding:5px 12px;font-size:11px;font-weight:700;cursor:pointer;text-decoration:none}
.chat-box{background:#fff;border-radius:14px;border:1px solid #e2ebe6;display:none;flex-direction:column;height:450px;margin-top:16px}
.chat-box.show{display:flex}
.chat-head{background:#073b2c;color:#fff;padding:12px 18px;display:flex;justify-content:space-between;align-items:center}
.chat-head .close{background:transparent;border:0;color:#fff;font-size:18px;cursor:pointer}
.chat-msgs{flex:1;overflow-y:auto;padding:14px;background:#f8fbf9}
.msg{margin-bottom:8px;max-width:75%;padding:8px 12px;border-radius:10px;font-size:13px}
.msg.me{background:#d9fdd3;margin-left:auto}
.msg.other{background:#f0f2f5}
.msg .who{font-size:10px;font-weight:700;color:#075e54}
.msg .time{font-size:9px;color:#6d7e76}
.msg img{max-width:150px;border-radius:8px;display:block;margin-top:4px}
.chat-input{display:flex;gap:8px;padding:10px 14px;background:#f0f2f5}
.chat-input input{flex:1;border:0;border-radius:20px;padding:10px 14px;outline:0;font-size:13px}
.chat-input .send{background:#075e54;color:#fff;border:0;border-radius:50%;width:40px;height:40px;font-size:18px;cursor:pointer}
.empty{text-align:center;padding:30px;color:#6d7e76}
.error{background:#ffe1de;color:#7a1f18;padding:12px;border-radius:10px;margin-bottom:12px;display:none}
</style>
</head>
<body>
<div class="page">
  <header class="topbar">
    <a class="brand" href="index.html"><img src="assets/bawaxict-logo.png" alt="BAWAX ICT"> BAWAX<span style="color:#f28a19">ICT</span></a>
    <a class="btn" href="skills.html">← Back</a>
  </header>

  <div class="warning">⚠️ <strong>Important:</strong> All messages and images are deleted after 12 hours. Please backup important info.</div>
  <div class="error" id="error"></div>

  <div class="owner-box"><h2 id="ownerName">Loading...</h2></div>

  <div class="client-area">
    <h3>💬 Clients</h3>
    <div id="clientList" class="client-grid"><div class="empty">No clients yet.</div></div>
  </div>

  <div class="chat-box" id="chatBox">
    <div class="chat-head"><span id="chatTitle">Chat</span><button class="close" id="closeChat">✕</button></div>
    <div class="chat-msgs" id="chatMsgs"></div>
    <div class="chat-input">
      <input type="text" id="chatInput" placeholder="Type a message...">
      <button class="send" id="sendBtn">➤</button>
    </div>
  </div>
</div>

<script>
(function(){
  var ownerParam = new URLSearchParams(location.search).get('owner') || '';
  var currentUser = getCurrentUser();
  var room = '';
  var poll = null;
  var isOwnerMode = currentUser && ownerParam && currentUser === ownerParam;

  function getCurrentUser(){
    try{ var x=JSON.parse(localStorage.getItem('bawaxict_identity')||'null'); if(x&&x.expires>Date.now()/1000) return x.username; }catch(e){}
    return null;
  }

  function esc(s){ return String(s||'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}

  function apiGet(path){
    return new Promise(function(res,rej){
      var x=new XMLHttpRequest();
      x.open('GET',path,true);
      x.onreadystatechange=function(){if(x.readyState!==4)return;try{var d=JSON.parse(x.responseText);if(x.status>=200&&x.status<300)res(d);else rej(new Error(d.error||'Error'));}catch(e){rej(new Error('Network error'));}};
      x.send();
    });
  }

  function apiPost(path,data){
    return new Promise(function(res,rej){
      var x=new XMLHttpRequest();
      x.open('POST',path,true);
      x.setRequestHeader('Content-Type','application/json');
      x.onreadystatechange=function(){if(x.readyState!==4)return;try{var d=JSON.parse(x.responseText);if(x.status>=200&&x.status<300)res(d);else rej(new Error(d.error||'Error'));}catch(e){rej(new Error('Network error'));}};
      x.send(JSON.stringify(data));
    });
  }

  function showError(msg){
    var e=document.getElementById('error');
    e.textContent=msg; e.style.display='block';
  }

  function loadConversations(){
    apiGet('/api/familyhub/conversations').then(function(d){
      var list=document.getElementById('clientList');
      var convos=d.conversations||[];
      if(!convos.length){list.innerHTML='<div class="empty">No clients yet.</div>';return;}
      list.innerHTML=convos.map(function(c){
        return '<div class="client-item"><span class="name">'+esc(c.username)+(c.unread?' <b>('+c.unread+')</b>':'')+'</span><a class="chat-btn" href="#" data-user="'+esc(c.username)+'">Chat</a></div>';
      }).join('');
      list.querySelectorAll('.chat-btn').forEach(function(b){
        b.onclick=function(e){e.preventDefault();openChat(this.dataset.user);};
      });
    }).catch(function(err){ showError(err.message||'Could not load clients.'); });
  }

  function openChat(username){
    room=username;
    var box=document.getElementById('chatBox');
    box.classList.add('show');
    document.getElementById('chatTitle').textContent='Chat with '+username;
    loadMsgs();
    if(poll)clearInterval(poll);
    poll=setInterval(loadMsgs,3000);
  }

  function loadMsgs(){
    if(!room)return;
    apiGet('/api/familyhub/private?with='+encodeURIComponent(room)).then(function(d){
      if(d.blocked){
        document.getElementById('chatMsgs').innerHTML='<div class="empty">Messaging is blocked between you and this user.</div>';
        document.getElementById('chatInput').disabled=true;
        document.getElementById('sendBtn').disabled=true;
        return;
      }
      var msgs=d.messages||[];
      var container=document.getElementById('chatMsgs');
      container.innerHTML=msgs.map(function(m){
        var me=m.sender_snapshot===currentUser;
        var att=m.attachment&&m.attachment.mimeType&&m.attachment.mimeType.indexOf('image')===0?'<img src="/api/media/'+m.attachment.id+'">':'';
        return '<div class="msg '+(me?'me':'other')+'"><div class="who">'+esc(m.sender_snapshot)+'</div>'+esc(m.message)+att+'<div class="time">'+new Date(m.created_at*1000).toLocaleTimeString()+'</div></div>';
      }).join('');
      container.scrollTop=container.scrollHeight;
    }).catch(function(err){ showError(err.message||'Could not load messages.'); });
  }

  function sendMsg(){
    var input=document.getElementById('chatInput');
    var text=input.value.trim();
    if(!text||!room)return;
    if(!currentUser){showError('Please log in first.');return;}
    input.value='';
    apiPost('/api/familyhub/private',{recipient:room,message:text}).then(function(){loadMsgs();}).catch(function(err){ showError(err.message||'Could not send message.'); });
  }

  document.getElementById('sendBtn').onclick=sendMsg;
  document.getElementById('chatInput').onkeydown=function(e){if(e.key==='Enter')sendMsg();};
  document.getElementById('closeChat').onclick=function(){
    document.getElementById('chatBox').classList.remove('show');
    if(poll){clearInterval(poll);poll=null;}
  };

  if(!currentUser){
    showError('Please log in first to use chat.');
    document.getElementById('ownerName').textContent='🔒 Login required';
    document.getElementById('clientList').innerHTML='<div class="empty"><a href="community-chat.html">Log in to continue →</a></div>';
    return;
  }

  if(!ownerParam){
    showError('No skill person specified.');
    document.getElementById('ownerName').textContent='Skill Chat';
    document.getElementById('clientList').innerHTML='<div class="empty">Go to <a href="skills.html">Skill Hub</a> and click Message on a listing.</div>';
    return;
  }

  if(isOwnerMode){
    document.getElementById('ownerName').textContent='📋 Your Skill Hub Messages';
    loadConversations();
  } else {
    document.querySelector('.client-area').style.display='none';
    document.getElementById('ownerName').textContent='💬 '+ownerParam;
    openChat(ownerParam);
  }
})();
</script>
</body>
</html>
