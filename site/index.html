<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BAWAXICT FamilyHub</title>
<link rel="stylesheet" href="css/familyhub-social.css">
<script src="config.js"></script>
</head>
<body>

<div class="connection-bar">
  <span>✅ Connected to BAWAXICT WIFI</span>
  <span style="margin-left:auto; font-size:13px;">12 people active now</span>
</div>

<div class="top-nav">
  <div class="logo">BAWAX<span>ICT</span> FamilyHub</div>
  <input type="text" class="search" placeholder="Search posts, people, groups...">
  <div style="display:flex; gap:16px; font-size:24px; align-items:center;">
    <span onclick="logout()" style="cursor:pointer; font-size:20px;">↪</span>
    <span>👤</span>
  </div>
</div>

<div class="greeting">
  <h1>Good morning, <span id="userName">Member</span> 👋</h1>
  <p>Here's what's happening around FamilyHub</p>
</div>

<div class="tabs">
  <div class="tab active">For You</div>
  <div class="tab">Following</div>
  <div class="tab">Trending</div>
</div>

<div class="composer">
  <div class="composer-avatar">👤</div>
  <input type="text" class="composer-input" placeholder="What's on your mind?">
  <button onclick="createPost()" style="background:var(--orange);color:white;padding:10px 24px;border-radius:999px;font-weight:800;">Post</button>
</div>

<div id="feed" style="padding-bottom:90px;"></div>

<div class="bottom-nav">
  <a href="#" class="active">🏠</a>
  <a href="#">🔎</a>
  <a href="#" onclick="createPost()" class="create">+</a>
  <a href="forum.html">💬</a>
  <a href="#">👤</a>
</div>

<script>
function logout() {
  if(confirm('End your session and logout?')) {
    fetch('/api/familyhub/logout', {method:'POST', credentials:'include'})
      .then(() => {
        localStorage.removeItem('bawaxict_username');
        localStorage.removeItem('familyhub_username');
        window.location.href = 'login.html';
      });
  }
}

function createPost() {
  alert('Create Post Modal coming in next update.\n\nOptions will include: Create post, Ask community, Share photo, Sell item, Offer service, Post opportunity, Create event.');
}

// Load username and feed
(function(){
  let name = 'Member';
  try {
    const stored = localStorage.getItem('bawaxict_username') || localStorage.getItem('familyhub_username') || '';
    if (stored) name = stored;
  } catch(e){}
  document.getElementById('userName').textContent = name;

  // Placeholder for your real feed
  document.getElementById('feed').innerHTML = `
    <div class="post"><div class="post-content" style="padding:20px;">
      <strong>Welcome to the new social FamilyHub feed.</strong><br><br>
      Your existing community chat, private messages, rewards, and marketplace features are still fully functional.<br><br>
      Use the bottom navigation or sidebar links.
    </div></div>`;
})();
</script>
</body>
</html>
