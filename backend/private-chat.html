<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B2E23">
<title>Chat | BAWAXICT FamilyHub</title>
<!--
  REBUILT for the BAWAXICT FamilyHub mockup design system.
  Replaces the previous WhatsApp-palette clone entirely. No #075e54/#d9fdd3.
  Data layer unchanged: /conversations, /private, /read, /typing, /receipts,
  /media/upload, /profile/public, /stream + /events. All via config.js.
-->
<link rel="stylesheet" href="css/familyhub-mockup.css">
<script src="config.js"></script>
<style>
body{height:100dvh;overflow:hidden}
.shell{display:flex;height:100dvh}

/* ---------- conversation list ---------- */
.side{width:330px;flex:none;background:var(--fh-card);border-right:1px solid var(--fh-border);
  display:flex;flex-direction:column}
.side-head{padding:16px 18px;border-bottom:1px solid var(--fh-border)}
.side-search{margin-top:12px;position:relative}
.side-search input{width:100%;height:38px;border-radius:var(--fh-pill);border:1px solid var(--fh-border);
  background:var(--fh-bg);padding:0 14px 0 36px;font-family:inherit;font-size:13px;outline:0}
.side-search input:focus{border-color:var(--fh-green-500)}
.side-search .mag{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--fh-faint);font-size:13px}
.conv-list{flex:1;overflow-y:auto;padding:8px}
.conv{display:flex;gap:12px;align-items:center;padding:11px 12px;border-radius:var(--fh-radius-sm);
  cursor:pointer;transition:.13s;position:relative}
.conv:hover{background:var(--fh-bg)}
.conv.active{background:var(--fh-green-050)}
.conv-av{position:relative;flex:none}
.conv-on{position:absolute;right:-1px;bottom:-1px;width:12px;height:12px;border-radius:50%;
  background:var(--fh-green-500);border:2.5px solid var(--fh-card)}
.conv-on.off{background:var(--fh-faint)}
.conv-main{flex:1;min-width:0}
.conv-top{display:flex;align-items:center;gap:8px}
.conv-name{font-weight:700;font-size:14px;color:var(--fh-ink);flex:1;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.conv-time{font-size:11px;color:var(--fh-faint);flex:none}
.conv-last{font-size:12.5px;color:var(--fh-muted);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;margin-top:2px}
.conv-badge{background:var(--fh-green-500);color:#fff;border-radius:var(--fh-pill);
  min-width:20px;height:20px;padding:0 6px;font-size:11px;font-weight:800;
  display:grid;place-items:center;flex:none}

/* ---------- thread ---------- */
.main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--fh-bg)}
.thread-head{height:var(--fh-header);flex:none;background:var(--fh-card);
  border-bottom:1px solid var(--fh-border);display:flex;align-items:center;gap:12px;padding:0 16px}
.back-btn{display:none;border:0;background:none;font-size:20px;color:var(--fh-ink);cursor:pointer;padding:4px}
.peer{display:flex;align-items:center;gap:11px;cursor:pointer;border:0;background:none;
  padding:4px 8px;border-radius:var(--fh-radius-sm);text-align:left;font-family:inherit}
.peer:hover{background:var(--fh-bg)}
.peer-name{font-weight:800;font-size:15px;color:var(--fh-ink)}
.peer-sub{font-size:11.5px;color:var(--fh-green-600);font-weight:600}
.peer-sub.off{color:var(--fh-faint)}

/* Mockup-system chat surface: CSS-only, replaces the 2.2 MB wallpaper PNG. */
.msgs{flex:1;overflow-y:auto;padding:20px 18px;scroll-behavior:smooth;
  background-color:var(--fh-bg);
  background-image:
    radial-gradient(circle at 1px 1px, rgba(11,46,35,.055) 1px, transparent 0),
    linear-gradient(180deg, rgba(18,183,106,.05), transparent 380px);
  background-size:22px 22px, 100% 100%;
}
.day{text-align:center;margin:16px 0 12px}
.day span{background:var(--fh-card);border:1px solid var(--fh-border);color:var(--fh-muted);
  font-size:11px;font-weight:700;padding:4px 12px;border-radius:var(--fh-pill)}
.grp{display:flex;gap:10px;margin-bottom:12px;align-items:flex-end}
.grp.me{flex-direction:row-reverse}
.grp-av{flex:none;opacity:0}
.grp.show-av .grp-av{opacity:1}
.grp-stack{display:flex;flex-direction:column;gap:3px;max-width:min(70%,560px)}
.grp.me .grp-stack{align-items:flex-end}
.bub{background:var(--fh-card);border:1px solid var(--fh-border);border-radius:16px 16px 16px 5px;
  padding:9px 13px;font-size:14px;line-height:1.5;color:var(--fh-ink);
  box-shadow:var(--fh-shadow-sm);overflow-wrap:anywhere;white-space:pre-wrap}
.grp.me .bub{background:var(--fh-green-900);color:#fff;border-color:var(--fh-green-900);
  border-radius:16px 16px 5px 16px}
.bub.media{padding:5px;overflow:hidden}
.bub img.att{display:block;border-radius:12px;max-width:100%;max-height:320px;object-fit:cover;cursor:zoom-in}
.bub audio{display:block;width:250px;max-width:100%;margin:3px}
.meta{display:flex;align-items:center;gap:5px;font-size:10.5px;color:var(--fh-faint);padding:0 4px}
.grp.me .meta{justify-content:flex-end}
.tick{font-size:12px;letter-spacing:-2px;color:var(--fh-faint)}
.tick.seen{color:var(--fh-green-500)}
.bub.deleted{background:var(--fh-bg);border-style:dashed;color:var(--fh-muted)}
.grp.me .bub.deleted{background:rgba(255,255,255,.14);color:rgba(255,255,255,.75);border-color:rgba(255,255,255,.3)}
.meta .edited{font-style:italic;opacity:.85}
/* long-press / tap action sheet for your own messages */
.msg-sheet{position:fixed;inset:0;z-index:500;display:none;align-items:flex-end;
  justify-content:center;background:rgba(11,46,35,.45)}
.msg-sheet.open{display:flex}
.msg-sheet-box{width:100%;max-width:420px;background:var(--fh-card);
  border-radius:18px 18px 0 0;padding:8px 12px calc(14px + env(safe-area-inset-bottom));
  box-shadow:0 -10px 32px rgba(11,46,35,.25)}
.msg-sheet-box .grab{width:38px;height:4px;border-radius:999px;background:var(--fh-border);margin:4px auto 10px}
.msg-act{display:flex;align-items:center;gap:10px;width:100%;min-height:50px;padding:0 14px;
  border:0;background:none;font-family:inherit;font-size:14.5px;font-weight:700;
  color:var(--fh-ink);cursor:pointer;border-radius:12px;text-align:left}
.msg-act:active{background:var(--fh-bg)}
.msg-act.danger{color:var(--fh-danger)}
.msg-act[disabled]{opacity:.4;cursor:not-allowed}
/* inline edit box */
.edit-wrap{padding:8px 0}
.edit-wrap textarea{width:100%;border:1px solid var(--fh-green-500);border-radius:12px;
  padding:10px 12px;font-family:inherit;font-size:16px;resize:vertical;min-height:70px;outline:0}
.edit-actions{display:flex;gap:8px;margin-top:8px}

.typing-row{display:flex;gap:10px;align-items:flex-end;margin-bottom:12px}
.typing-bub{background:var(--fh-card);border:1px solid var(--fh-border);border-radius:16px 16px 16px 5px;
  padding:12px 15px;display:flex;gap:4px;box-shadow:var(--fh-shadow-sm)}
.typing-bub i{width:7px;height:7px;border-radius:50%;background:var(--fh-faint);
  animation:bounce 1.3s infinite}
.typing-bub i:nth-child(2){animation-delay:.18s}
.typing-bub i:nth-child(3){animation-delay:.36s}
@keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.45}30%{transform:translateY(-5px);opacity:1}}

/* ---------- composer ---------- */
.composer{flex:none;background:var(--fh-card);border-top:1px solid var(--fh-border);padding:12px 16px}
.pending{display:none;margin-bottom:10px;padding:10px;background:var(--fh-bg);
  border:1px solid var(--fh-border);border-radius:var(--fh-radius-sm)}
.pending.show{display:block}
.pending-top{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;
  color:var(--fh-ink-700);margin-bottom:8px}
.pending img{max-height:120px;border-radius:10px;display:block}
.pending audio{width:100%;max-width:280px}
.bar{height:4px;background:var(--fh-border);border-radius:var(--fh-pill);overflow:hidden;margin-top:8px;display:none}
.bar.show{display:block}
.bar i{display:block;height:100%;width:0;background:var(--fh-green-500);transition:width .2s}
.comp-row{display:flex;align-items:flex-end;gap:9px}
.icon-btn{width:40px;height:40px;flex:none;border-radius:50%;border:1px solid var(--fh-border);
  background:var(--fh-card);cursor:pointer;font-size:17px;color:var(--fh-ink-700);
  display:grid;place-items:center;transition:.14s}
.icon-btn:hover{background:var(--fh-bg)}
.icon-btn.rec{background:var(--fh-danger);border-color:var(--fh-danger);color:#fff;
  animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(180,35,24,.5)}50%{box-shadow:0 0 0 8px rgba(180,35,24,0)}}
.comp-input{flex:1;border:1px solid var(--fh-border);border-radius:22px;background:var(--fh-bg);
  padding:10px 16px;font-family:inherit;font-size:14px;line-height:1.45;resize:none;
  max-height:130px;outline:0}
.comp-input:focus{border-color:var(--fh-green-500);background:var(--fh-card)}
.send{width:42px;height:42px;flex:none;border-radius:50%;border:0;background:var(--fh-green-500);
  color:#fff;font-size:17px;cursor:pointer;display:grid;place-items:center;transition:.14s}
.send:hover{background:var(--fh-green-600)}
.send:disabled{opacity:.4;cursor:not-allowed}
.rec-hint{font-size:11.5px;color:var(--fh-danger);font-weight:700;margin-top:7px;display:none}
.rec-hint.show{display:block}

/* ---------- profile panel ---------- */
.pp-av{display:grid;place-items:center;margin-bottom:14px}
.pp-row{display:flex;justify-content:space-between;padding:10px 0;
  border-bottom:1px solid var(--fh-border);font-size:13px}
.pp-row:last-child{border:0}
.pp-row span{color:var(--fh-muted)}
.pp-row b{color:var(--fh-ink);font-weight:700}

.lightbox{position:fixed;inset:0;background:rgba(11,46,35,.92);z-index:600;display:none;
  align-items:center;justify-content:center;padding:24px;cursor:zoom-out}
.lightbox.open{display:flex}
.lightbox img{max-width:100%;max-height:100%;border-radius:12px}

@media(max-width:860px){
  .side{width:100%;position:absolute;inset:0;z-index:10}
  .shell.in-thread .side{display:none}
  .main{display:none}
  .shell.in-thread .main{display:flex}
  .back-btn{display:block}
  .grp-stack{max-width:82%}
}
</style>
</head>
<body>

<div class="shell" id="shell">

  <aside class="side">
    <div class="side-head">
      <div class="fh-row">
        <a href="forum.html" class="fh-brand">
          <span class="fh-brand-mark">B</span>
          <span class="fh-brand-text"><b>BAWAXICT</b><span>FamilyHub</span></span>
        </a>
        <div class="fh-spacer"></div>
        <a href="forum.html" class="fh-btn fh-btn-ghost fh-btn-sm">← Feed</a>
      </div>
      <div class="side-search">
        <span class="mag">⌕</span>
        <input id="search" placeholder="Search conversations or members…" autocomplete="off">
      </div>
    </div>
    <div class="conv-list" id="convList">
      <div class="fh-empty"><div class="ico">💬</div><b>Loading…</b></div>
    </div>
  </aside>

  <main class="main">
    <header class="thread-head">
      <button class="back-btn" id="backBtn" aria-label="Back">←</button>
      <button class="peer" id="peerBtn">
        <span class="fh-av fh-av-sm" id="peerAv">?</span>
        <span>
          <span class="peer-name" id="peerName">Select a conversation</span><span id="peerBadge"></span><br>
          <span class="peer-sub off" id="peerSub">—</span>
        </span>
      </button>
      <div class="fh-spacer"></div>
      <button class="icon-btn" id="blockBtn" title="Block or unblock" aria-label="Block or unblock"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M5.6 5.6l12.8 12.8"/></svg></button>
    </header>

    <div class="msgs" id="msgs">
      <div class="fh-empty">

        Choose someone on the left to start chatting.

    </div>

    <div class="composer" id="composer" style="display:none">
      <div class="pending" id="pending">
        <div class="pending-top">
          <span id="pendingLabel">Attachment ready</span>
          <div class="fh-spacer"></div>
          <button class="fh-x" id="pendingClear" style="width:26px;height:26px;font-size:14px">×</button>
        </div>
        <div id="pendingPreview"></div>
      </div>
      <div class="bar" id="bar"><i id="barFill"></i></div>
      <div class="rec-hint" id="recHint">● Recording… tap the mic again to stop</div>
      <div class="comp-row">
        <button class="icon-btn" id="imgBtn" title="Send a photo" aria-label="Send a photo"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.6"/><path d="M21 15l-5-5L5 21"/></svg></button>
        <button class="icon-btn" id="micBtn" title="Record a voice note" aria-label="Record a voice note"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0014 0M12 19v3"/></svg></button>
        <textarea class="comp-input" id="input" rows="1" placeholder="Write a message…"></textarea>
        <button class="send" id="sendBtn" disabled aria-label="Send"><svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M3.2 20.6L21.6 12 3.2 3.4l.02 6.7L16 12 3.22 13.9z"/></svg></button>
      </div>
      <input type="file" id="file" accept="image/jpeg,image/png,image/webp" class="fh-sr">
    </div>
  </main>
</div>

<!-- Profile panel: same modal language as the rest of the system -->
<div class="fh-modal" id="profileModal">
  <div class="fh-modal-box">
    <div class="fh-modal-head">
      <h3>Member profile</h3>
      <button class="fh-x" data-close>×</button>
    </div>
    <div class="fh-modal-body">
      <div class="pp-av"><span class="fh-av fh-av-lg" id="ppAv">?</span></div>
      <div style="text-align:center;margin-bottom:16px">
        <div style="font-weight:800;font-size:18px" id="ppName">—</div>
        <div class="fh-badge" id="ppStatus" style="margin-top:6px">Member</div>
      </div>
      <div id="ppRows"></div>
      <button class="fh-btn fh-btn-block" id="ppFollow" style="margin-top:16px">Follow</button>
    </div>
  </div>
</div>

<div class="msg-sheet" id="msgSheet" role="dialog" aria-modal="true" aria-label="Message actions">
  <div class="msg-sheet-box">
    <div class="grab" aria-hidden="true"></div>
    <button class="msg-act" id="msgEdit" type="button">✏️ Edit message</button>
    <button class="msg-act danger" id="msgDelete" type="button">🗑 Delete message</button>
    <button class="msg-act" id="msgCancel" type="button">Cancel</button>
  </div>
</div>

<div class="lightbox" id="lightbox"><img id="lightboxImg" alt=""></div>

<script>
(function(){
'use strict';
var CFG=window.BAWAXICT_CONFIG||{};
var API=(CFG.familyHubApiBase||'/api/familyhub/').replace(/\/$/,'');

/* ---------------------------------------------------------------
   api(): the old build set xhr.timeout=9000 for EVERY request,
   including multipart uploads. A 2 MB image over a hotspot link
   needs far longer than 9 s, so uploads always failed. Uploads now
   get a generous timeout plus real progress; JSON calls stay snappy.
   --------------------------------------------------------------- */
function api(path,opt){
  opt=opt||{};
  return new Promise(function(res,rej){
    var x=new XMLHttpRequest();
    x.open(opt.method||'GET',API+path,true);
    x.withCredentials=true;
    x.setRequestHeader('Accept','application/json');
    if((opt.method||'GET').toUpperCase()==='POST'&&!opt.formData)
      x.setRequestHeader('Content-Type','application/json');
    x.timeout=opt.formData?180000:12000;
    if(opt.formData&&opt.onProgress&&x.upload){
      x.upload.onprogress=function(e){ if(e.lengthComputable) opt.onProgress(e.loaded/e.total); };
    }
    x.onreadystatechange=function(){
      if(x.readyState!==4)return;
      var d={}; try{d=JSON.parse(x.responseText||'{}')}catch(e){}
      if(x.status>=200&&x.status<300)res(d);
      else rej(new Error(d.error||('Request failed ('+x.status+')')));
    };
    x.onerror=function(){var e=new Error('Unable to reach the FamilyHub server.');e.netFail=true;rej(e)};
    x.ontimeout=function(){var e=new Error(opt.formData
      ?'Upload timed out. Your connection may be slow — try a smaller file.'
      :'The FamilyHub server timed out.');e.netFail=true;rej(e)};
    x.send(opt.formData||opt.body||null);
  });
}
function J(o){return JSON.stringify(o||{})}
function esc(s){return String(s==null?'':s).replace(/[&<>'"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c];});}
function initial(n){return ((n||'?').trim().charAt(0)||'?').toUpperCase()}
/* Tier badge next to a name. Novice (tier 0) renders nothing -- it is the
   default state, so showing it everywhere would just be noise. */
function badgeHtml(b){
  if(!b||!b.tier) return '';
  return '<span class="fh-badge-mini" style="background:'+esc(b.color||'#98A2B3')+'"'
       +' title="'+esc(b.label)+' member"><span class="bdot"></span>'+esc(b.label)+'</span>';
}
function mediaUrl(id){return API+'/media/'+id}
function toast(t){
  var e=document.createElement('div');e.className='fh-toast';e.textContent=t;
  document.body.appendChild(e);setTimeout(function(){e.remove()},3200);
}
function hhmm(ts){try{return new Date(ts*1000).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}catch(e){return''}}
function dayLabel(ts){
  var d=new Date(ts*1000),n=new Date();
  var same=d.toDateString()===n.toDateString();
  if(same)return 'Today';
  var y=new Date(n.getTime()-86400000);
  if(d.toDateString()===y.toDateString())return 'Yesterday';
  return d.toLocaleDateString([],{day:'numeric',month:'short'});
}

var me=null,selected=null,threadId=0,pending=null,convs=[],
    lastEventId=0,recorder=null,chunks=[],recording=false,
    typingTimer=null,lastTypingSent=0,pollTimer=null,es=null;

var $=function(id){return document.getElementById(id)};

/* ---------------- session ---------------- */
/* Stable per-device id. MUST use the same localStorage key as forum.html
   ('bawaxict_client_id') so a device bound in the feed is recognised here. */
function clientId(){
  var k='bawaxict_client_id',v='';
  try{v=localStorage.getItem(k)||''}catch(e){}
  if(!v){
    v='browser-'+((window.crypto&&crypto.randomUUID)?crypto.randomUUID()
      :(Date.now()+'-'+Math.random().toString(16).slice(2)));
    try{localStorage.setItem(k,v)}catch(e){}
  }
  return v;
}

function startSession(username){
  me=username;
  loadConvs();
  startStream();
  startEventPolling();
  var q=new URLSearchParams(location.search).get('with');
  if(q) open(q);
}

/* Opening Chat must land in Chat -- never bounce a known user back to the
   join gate. Same fallback chain forum.html already uses:
     1. live cookie session
     2. else, if this device is still bound (inside its 21-day identity),
        silently re-join with the bound username + client_id
     3. only a genuinely unknown device sees the join screen
   This uses the existing device-binding contract and does not weaken it:
   a name bound to a DIFFERENT device still gets 409 recoveryRequired. */
api('/session').then(function(s){
  if(s.authenticated){ startSession(s.username); return; }
  throw new Error('no session');
}).catch(function(err){
  if(err&&err.netFail) return showOffline();
  var cid=clientId();
  return api('/device?client_id='+encodeURIComponent(cid)).then(function(d){
    if(d&&d.bound&&d.username){
      return api('/join',{method:'POST',body:J({username:d.username,client_id:cid})})
        .then(function(r){
          if(!r||!r.ok)throw new Error('rejoin failed');
          startSession(r.username);
        });
    }
    throw new Error('device not bound');
  }).catch(function(e2){
    if(e2&&e2.netFail) return showOffline();
    // Genuinely unknown device: go to the join screen, then come straight
    // back to the conversation the user was trying to open.
    var q=new URLSearchParams(location.search).get('with');
    location.href='community-chat.html?next='
      +encodeURIComponent('private-chat.html'+(q?'?with='+q:''));
  });
});

function showOffline(){
  $('convList').innerHTML='<div class="fh-empty"><div class="ico">⚠</div><b>Cannot reach FamilyHub</b>Check your connection.</div>';
}

/* ---------------- conversations ---------------- */
function loadConvs(){
  return api('/conversations').then(function(d){
    convs=d.conversations||[];
    renderConvs();
  }).catch(function(){});
}
/* A media-only message has an empty body; show what it actually is
   rather than the misleading "Conversation started" placeholder. */
function preview(c){
  if(c.message&&c.message.trim())return c.message;
  if(c.created_at&&c.threadId)return 'Attachment';
  return 'Conversation started';
}
function renderConvs(){
  var q=($('search').value||'').toLowerCase().trim();
  var list=convs.filter(function(c){return !q||c.username.toLowerCase().indexOf(q)>=0});
  if(!list.length){
    $('convList').innerHTML='<div class="fh-empty"><div class="ico">💬</div><b>No conversations yet</b>'
      +'Open a member\u2019s profile in the feed to start one.</div>';
    return;
  }
  $('convList').innerHTML=list.map(function(c){
    return '<div class="conv'+(c.username===selected?' active':'')+'" data-u="'+esc(c.username)+'">'
      +'<div class="conv-av"><span class="fh-av">'+esc(initial(c.username))+'</span>'
      +'<i class="conv-on'+(c.online?'':' off')+'"></i></div>'
      +'<div class="conv-main"><div class="conv-top">'
      +'<span class="conv-name">'+esc(c.username)+'</span>'+badgeHtml(c.badge)
      +'<span class="conv-time">'+hhmm(c.created_at)+'</span></div>'
      +'<div class="conv-last">'+esc(preview(c))+'</div></div>'
      +(c.unread?'<span class="conv-badge">'+c.unread+'</span>':'')+'</div>';
  }).join('');
  Array.prototype.forEach.call($('convList').querySelectorAll('.conv'),function(el){
    el.onclick=function(){open(el.getAttribute('data-u'))};
  });
}
$('search').addEventListener('input',renderConvs);

/* ---------------- open a thread ---------------- */
function open(username){
  selected=username;
  $('shell').classList.add('in-thread');
  $('composer').style.display='';
  $('peerName').textContent=username;
  $('peerAv').textContent=initial(username);
  var c=convs.filter(function(x){return x.username===username})[0];
  $('peerBadge').innerHTML = c ? badgeHtml(c.badge) : '';
  setPresence(c?c.online:false);
  renderConvs();
  loadThread(true);
  if(pollTimer)clearInterval(pollTimer);
  pollTimer=setInterval(tick,3000);
}
function setPresence(on){
  $('peerSub').textContent=on?'Online now':'Offline';
  $('peerSub').className='peer-sub'+(on?'':' off');
}
$('backBtn').onclick=function(){
  $('shell').classList.remove('in-thread');
  selected=null; if(pollTimer)clearInterval(pollTimer);
};

var cacheMsgs=[],cacheReceipts={};
function loadThread(scroll){
  if(!selected)return Promise.resolve();
  return api('/private?with='+encodeURIComponent(selected)).then(function(d){
    threadId=d.thread||0;
    if(d.blocked){
      $('msgs').innerHTML='<div class="fh-empty"><div class="ico">⊘</div><b>Messaging is blocked</b>'
        +'You cannot exchange messages with this member.</div>';
      return;
    }
    cacheMsgs=d.messages||[];
    if(threadId){
      api('/read',{method:'POST',body:J({threadId:threadId})}).then(loadConvs).catch(function(){});
      api('/receipts?threadId='+threadId).then(function(r){
        (r.receipts||[]).forEach(function(x){cacheReceipts[x.id]=x});
        render(scroll);
      }).catch(function(){render(scroll)});
    } else render(scroll);
  }).catch(function(e){
    $('msgs').innerHTML='<div class="fh-empty"><div class="ico">⚠</div><b>'+esc(e.message)+'</b></div>';
  });
}

function render(scroll){
  var box=$('msgs');
  if(!cacheMsgs.length){
    box.innerHTML='<div class="fh-empty"><div class="ico">👋</div><b>No messages yet</b>'
      +'Say hello to '+esc(selected)+'.</div>';
    return;
  }
  var html='',lastDay='',lastSender=null;
  cacheMsgs.forEach(function(m,i){
    var mine=m.sender_snapshot===me;
    var d=dayLabel(m.created_at);
    if(d!==lastDay){html+='<div class="day"><span>'+esc(d)+'</span></div>';lastDay=d;lastSender=null}
    var next=cacheMsgs[i+1];
    var last=!next||next.sender_snapshot!==m.sender_snapshot||
             dayLabel(next.created_at)!==d;
    var showAv=last;
    var body='';
    var a=m.attachment;
    if(a&&a.kind==='image'){
      body='<div class="bub media"><img class="att" src="'+mediaUrl(a.id)+'" alt="'+esc(a.filename||'Photo')+'" loading="lazy"></div>';
    }else if(a&&a.kind==='voice'){
      body='<div class="bub media"><audio controls preload="metadata" src="'+mediaUrl(a.id)+'"></audio></div>';
    }
    if(m.message) body+='<div class="bub">'+esc(m.message)+'</div>';
    if(m.deleted_at) body='<div class="bub deleted"><i>🚫 This message was deleted</i></div>';
    if(!body) body='<div class="bub"><i class="fh-muted">Attachment expired</i></div>';

    var tick='';
    if(mine){
      var r=cacheReceipts[m.id]||{deliveredAt:m.delivered_at,seenAt:m.seen_at};
      if(r&&r.seenAt) tick='<span class="tick seen" title="Seen">✓✓</span>';
      else if(r&&r.deliveredAt) tick='<span class="tick" title="Delivered">✓✓</span>';
      else tick='<span class="tick" title="Sent">✓</span>';
    }
    html+='<div class="grp'+(mine?' me':'')+(showAv?' show-av':'')+'"'
      +(mine&&!m.deleted_at?' data-mid="'+m.id+'" data-can-edit="'+((Date.now()/1000-m.created_at)<=EDIT_WINDOW?'1':'0')+'"':'')+'>'
      +'<span class="fh-av fh-av-sm grp-av">'+esc(initial(m.sender_snapshot))+'</span>'
      +'<div class="grp-stack">'+body
      +(last?'<div class="meta">'+(m.edited_at?'<span class="edited">edited</span> ':'')+esc(hhmm(m.created_at))+' '+tick+'</div>':'')
      +'</div></div>';
    lastSender=m.sender_snapshot;
  });
  html+='<div id="typingSlot"></div>';
  box.innerHTML=html;
  Array.prototype.forEach.call(box.querySelectorAll('img.att'),function(img){
    img.onclick=function(){$('lightboxImg').src=img.src;$('lightbox').classList.add('open')};
  });
  if(scroll!==false) box.scrollTop=box.scrollHeight;
}
$('lightbox').onclick=function(){this.classList.remove('open')};

/* ---------------- edit / delete your own messages ----------------
   Long-press (touch) or click your own bubble to open the action sheet.
   Edit is allowed inside EDIT_WINDOW; the server enforces the same limit,
   so a stale tab cannot bypass it. Delete is a soft delete: the recipient
   keeps a "message was deleted" tombstone rather than the row vanishing,
   which keeps receipts and ordering intact. */
var EDIT_WINDOW = 15 * 60;
var sheetMid = null;

function openMsgSheet(mid, canEdit){
  sheetMid = mid;
  $('msgEdit').disabled = !canEdit;
  $('msgEdit').title = canEdit ? '' : 'Messages can only be edited for 15 minutes';
  $('msgSheet').classList.add('open');
}
function closeMsgSheet(){ $('msgSheet').classList.remove('open'); sheetMid = null; }
$('msgCancel').onclick = closeMsgSheet;
$('msgSheet').onclick = function(e){ if(e.target === this) closeMsgSheet(); };
document.addEventListener('keydown', function(e){
  if(e.key === 'Escape' && $('msgSheet').classList.contains('open')) closeMsgSheet();
});

(function(){
  var box = $('msgs'), timer = null, longPressed = false;
  function target(e){
    var g = e.target.closest ? e.target.closest('.grp[data-mid]') : null;
    return g;
  }
  box.addEventListener('touchstart', function(e){
    var g = target(e); if(!g) return;
    longPressed = false;
    timer = setTimeout(function(){
      longPressed = true;
      openMsgSheet(Number(g.getAttribute('data-mid')), g.getAttribute('data-can-edit') === '1');
    }, 450);
  }, {passive:true});
  box.addEventListener('touchend', function(){ if(timer) clearTimeout(timer); }, {passive:true});
  box.addEventListener('touchmove', function(){ if(timer) clearTimeout(timer); }, {passive:true});
  box.addEventListener('click', function(e){
    if(longPressed){ longPressed = false; return; }
    if(e.target.tagName === 'IMG' || e.target.tagName === 'AUDIO') return;
    // Ignore clicks inside the inline edit box: its own Save/Cancel buttons
    // would otherwise bubble up here and immediately reopen the sheet.
    if(e.target.closest && e.target.closest('.edit-wrap')) return;
    var g = target(e); if(!g) return;
    openMsgSheet(Number(g.getAttribute('data-mid')), g.getAttribute('data-can-edit') === '1');
  });
})();

$('msgDelete').onclick = function(){
  var mid = sheetMid;
  closeMsgSheet();
  if(!mid) return;
  if(!confirm('Delete this message? The other person will see that a message was deleted.')) return;
  api('/private/delete', {method:'POST', body:J({messageId:mid})}).then(function(){
    return loadThread(false);
  }).then(loadConvs).catch(function(e){ toast(e.message || 'Could not delete.'); });
};

$('msgEdit').onclick = function(){
  var mid = sheetMid;
  closeMsgSheet();
  if(!mid) return;
  var grp = document.querySelector('.grp[data-mid="' + mid + '"]');
  if(!grp) return;
  var stack = grp.querySelector('.grp-stack');
  var bub = stack.querySelector('.bub:not(.media)');
  if(!bub) return toast('Only text messages can be edited.');
  var original = bub.textContent;

  var wrap = document.createElement('div');
  wrap.className = 'edit-wrap';
  var ta = document.createElement('textarea');
  ta.value = original;
  var acts = document.createElement('div');
  acts.className = 'edit-actions';
  var save = document.createElement('button');
  save.className = 'fh-btn fh-btn-sm'; save.type = 'button'; save.textContent = 'Save';
  var cancel = document.createElement('button');
  cancel.className = 'fh-btn fh-btn-ghost fh-btn-sm'; cancel.type = 'button'; cancel.textContent = 'Cancel';
  acts.appendChild(save); acts.appendChild(cancel);
  wrap.appendChild(ta); wrap.appendChild(acts);
  bub.style.display = 'none';
  stack.insertBefore(wrap, bub.nextSibling);
  ta.focus();

  function restore(){ wrap.remove(); bub.style.display = ''; }
  cancel.onclick = restore;
  save.onclick = function(){
    var text = ta.value.trim();
    if(!text) return toast('Message cannot be empty.');
    if(text === original) return restore();
    save.disabled = true;
    api('/private/edit', {method:'POST', body:J({messageId:mid, message:text})}).then(function(){
      restore();
      return loadThread(false);
    }).then(loadConvs).catch(function(e){
      save.disabled = false;
      toast(e.message || 'Could not edit.');
    });
  };
};

/* ---------------- live updates ---------------- */
function tick(){
  if(!selected||!threadId)return;
  api('/typing?threadId='+threadId).then(function(d){
    var slot=$('typingSlot'); if(!slot)return;
    if((d.typing||[]).length){
      slot.innerHTML='<div class="typing-row"><span class="fh-av fh-av-sm">'
        +esc(initial(d.typing[0]))+'</span><div class="typing-bub"><i></i><i></i><i></i></div></div>';
    } else slot.innerHTML='';
  }).catch(function(){});
  api('/receipts?threadId='+threadId).then(function(r){
    var changed=false;
    (r.receipts||[]).forEach(function(x){
      var p=cacheReceipts[x.id];
      if(!p||p.seenAt!==x.seenAt||p.deliveredAt!==x.deliveredAt){cacheReceipts[x.id]=x;changed=true}
    });
    if(changed)render(false);
  }).catch(function(){});
}

/* ------------------------------------------------------------------
   Live updates.

   server.py closes every SSE stream after SSE_MAX_SECONDS (55s) by
   design, so the client MUST reconnect for the life of the page. The
   previous implementation reconnected only from es.onerror, and a clean
   server-side close does not reliably fire an error in every browser --
   so after the first 55s the stream went silent for good and messages
   only showed up on a manual refresh.

   This version:
     - reconnects on 'error' AND on a clean close, and proactively
       recycles the stream just before the server's own cutoff
     - uses a watchdog: if no frame or keepalive arrives within
       STREAM_IDLE_MS, the socket is presumed dead and rebuilt
     - always runs a low-frequency /events poll as a safety net, so a
       blocked or buffered SSE path degrades instead of failing silently
     - dedupes by lastEventId, so SSE and the poll can overlap safely
   ------------------------------------------------------------------ */
var STREAM_CYCLE_MS = 50000;   // recycle before the server's 55s cutoff
var STREAM_IDLE_MS  = 30000;   // server sends keepalive every 15s
var streamCycleTimer=null, streamIdleTimer=null, streamRetry=0, pollTimerEvents=null;

function clearStreamTimers(){
  if(streamCycleTimer){ clearTimeout(streamCycleTimer); streamCycleTimer=null; }
  if(streamIdleTimer){ clearTimeout(streamIdleTimer); streamIdleTimer=null; }
}
function closeStream(){
  clearStreamTimers();
  if(es){ try{ es.onerror=null; es.onmessage=null; es.close(); }catch(e){} es=null; }
}
function armIdleWatchdog(){
  if(streamIdleTimer) clearTimeout(streamIdleTimer);
  streamIdleTimer=setTimeout(function(){ restartStream(600); }, STREAM_IDLE_MS);
}
function restartStream(delay){
  closeStream();
  setTimeout(startStream, delay || 0);
}

function startStream(){
  if(document.hidden){
    // Don't hold a stream open in a backgrounded tab; the poll covers it.
    setTimeout(startStream, 5000);
    return;
  }
  closeStream();
  var url=API+'/stream?since='+lastEventId;
  try{
    // NOTE: withCredentials must be passed in the init object; same-origin
    // requests send cookies regardless, which is how this is deployed.
    es=new EventSource(url,{withCredentials:true});
  }catch(e){
    es=null;
    setTimeout(startStream, 8000);   // poll below keeps things moving
    return;
  }

  es.onopen=function(){
    streamRetry=0;
    armIdleWatchdog();
    clearTimeout(streamCycleTimer);
    // Pre-empt the server's own cutoff so there is no dead window.
    streamCycleTimer=setTimeout(function(){ restartStream(0); }, STREAM_CYCLE_MS);
  };
  es.onmessage=function(ev){
    armIdleWatchdog();
    var d={}; try{ d=JSON.parse(ev.data); }catch(e){ return; }
    if(d.id){ if(d.id<=lastEventId) return; lastEventId=d.id; }
    handleEvent(d);
  };
  es.onerror=function(){
    // Fires on network drop and (in most browsers) on a clean close.
    // Back off gently so a genuinely unreachable server is not hammered.
    streamRetry=Math.min(streamRetry+1,5);
    restartStream(Math.min(1000*streamRetry,6000));
  };
}

function pollEvents(){
  return api('/events?since='+lastEventId).then(function(d){
    var evs=d.events||[];
    evs.forEach(function(e){
      if(e.id&&e.id<=lastEventId) return;
      if(e.id) lastEventId=e.id;
      handleEvent(e);
    });
    if(d.latestId&&d.latestId>lastEventId) lastEventId=d.latestId;
  }).catch(function(){});
}

/* Safety net. Cheap (one indexed query), and the only thing standing
   between the user and a silent chat if SSE is blocked by a proxy. */
function startEventPolling(){
  if(pollTimerEvents) clearInterval(pollTimerEvents);
  pollTimerEvents=setInterval(function(){
    if(!document.hidden) pollEvents();
  }, 6000);
}

/* Coming back to the tab is the moment staleness is most visible. */
document.addEventListener('visibilitychange',function(){
  if(!document.hidden){
    pollEvents();
    if(!es) restartStream(0);
  }
});
window.addEventListener('online',function(){ pollEvents(); restartStream(0); });
function handleEvent(d){
  if(!d||!d.kind)return;
  if(d.kind==='private.message'){
    loadConvs();
    if(selected&&d.payload&&d.payload.sender===selected) loadThread(true);
  }else if(d.kind==='private.edited' || d.kind==='private.deleted'){
    if(threadId && d.payload && d.payload.threadId===threadId) loadThread(false);
    loadConvs();
  }else if(d.kind==='private.seen'){
    if(threadId&&d.payload&&d.payload.threadId===threadId) tick();
  }
}

/* ---------------- composing ---------------- */
var input=$('input');
input.addEventListener('input',function(){
  input.style.height='auto';
  input.style.height=Math.min(input.scrollHeight,130)+'px';
  $('sendBtn').disabled=!input.value.trim()&&!pending;
  var now=Date.now();
  if(threadId&&now-lastTypingSent>2500){
    lastTypingSent=now;
    api('/typing',{method:'POST',body:J({threadId:threadId})}).catch(function(){});
  }
});
input.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}
});
$('sendBtn').onclick=send;

function send(){
  var text=input.value.trim();
  if(!text&&!pending)return;
  if(!selected)return;
  $('sendBtn').disabled=true;
  var payload={recipient:selected,message:text};
  if(pending)payload.attachmentId=Number(pending.id);
  api('/private',{method:'POST',body:J(payload)}).then(function(){
    input.value='';input.style.height='auto';
    clearPending();
    return loadThread(true);
  }).then(loadConvs).catch(function(e){
    toast(e.message||'Could not send.');
  }).finally(function(){ $('sendBtn').disabled=false; });
}

/* ---------------- image attachment ----------------
   Downscaled client-side before upload: the backend caps images at 2 MB,
   and a phone camera JPEG is routinely 4-6 MB. Downscaling makes the
   upload both legal and fast on a hotspot link.                        */
$('imgBtn').onclick=function(){$('file').click()};
$('file').addEventListener('change',function(){
  var f=this.files&&this.files[0];
  this.value='';
  if(!f)return;
  downscale(f).then(upload).catch(function(e){toast(e.message||'Could not read that image.')});
});

function downscale(file){
  return new Promise(function(res,rej){
    if(!/^image\//.test(file.type))return res(file);
    var img=new Image(),url=URL.createObjectURL(file);
    img.onload=function(){
      URL.revokeObjectURL(url);
      var max=1600,w=img.width,h=img.height;
      if(w<=max&&h<=max&&file.size<=1200000)return res(file);
      var s=Math.min(max/w,max/h,1);
      var c=document.createElement('canvas');
      c.width=Math.round(w*s);c.height=Math.round(h*s);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      c.toBlob(function(b){
        if(!b)return res(file);
        res(new File([b],(file.name||'photo').replace(/\.[^.]+$/,'')+'.jpg',{type:'image/jpeg'}));
      },'image/jpeg',.82);
    };
    img.onerror=function(){URL.revokeObjectURL(url);rej(new Error('Unsupported image.'))};
    img.src=url;
  });
}

function upload(file){
  var fd=new FormData();
  fd.append('file',file,file.name||'attachment');
  $('bar').classList.add('show');$('barFill').style.width='0%';
  return api('/media/upload',{method:'POST',formData:fd,onProgress:function(p){
    $('barFill').style.width=Math.round(p*100)+'%';
  }}).then(function(d){
    $('bar').classList.remove('show');
    if(!d.ok||!d.media)throw new Error(d.error||'Upload failed.');
    pending=d.media;
    showPending(d.media);
    $('sendBtn').disabled=false;
  }).catch(function(e){
    $('bar').classList.remove('show');
    toast(e.message||'Upload failed.');
  });
}
function showPending(m){
  $('pending').classList.add('show');
  $('pendingLabel').textContent=m.kind==='image'?'Photo ready to send':'Voice note ready to send';
  var p=$('pendingPreview');p.innerHTML='';
  if(m.kind==='image'){
    var i=document.createElement('img');i.src=mediaUrl(m.id);p.appendChild(i);
  }else{
    var a=document.createElement('audio');a.controls=true;a.src=mediaUrl(m.id);p.appendChild(a);
  }
}
function clearPending(){
  pending=null;$('pending').classList.remove('show');$('pendingPreview').innerHTML='';
}
$('pendingClear').onclick=clearPending;

/* ---------------- voice notes ----------------
   Wired to the SAME /media/upload endpoint, which already accepts
   audio/webm|ogg|mp4|mpeg|wav as kind='voice'. No backend change.   */
function pickMime(){
  var c=['audio/webm;codecs=opus','audio/webm','audio/ogg;codecs=opus','audio/mp4'];
  for(var i=0;i<c.length;i++){
    try{ if(window.MediaRecorder&&MediaRecorder.isTypeSupported(c[i]))return c[i]; }catch(e){}
  }
  return '';
}
$('micBtn').onclick=function(){
  if(recording)return stopRec();
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!window.MediaRecorder)
    return toast('Voice notes are not supported by this browser.');
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
    var mime=pickMime();
    recorder=new MediaRecorder(stream,mime?{mimeType:mime}:undefined);
    chunks=[];
    recorder.ondataavailable=function(e){if(e.data&&e.data.size)chunks.push(e.data)};
    recorder.onstop=function(){
      stream.getTracks().forEach(function(t){t.stop()});
      var type=(recorder.mimeType||mime||'audio/webm').split(';')[0];
      var blob=new Blob(chunks,{type:type});
      if(blob.size<800)return toast('That recording was too short.');
      var ext=type.indexOf('ogg')>=0?'ogg':(type.indexOf('mp4')>=0?'m4a':'webm');
      upload(new File([blob],'voice-note.'+ext,{type:type}));
    };
    recorder.start();
    recording=true;
    $('micBtn').classList.add('rec');
    $('recHint').classList.add('show');
  }).catch(function(){ toast('Microphone permission was denied.'); });
};
function stopRec(){
  try{recorder&&recorder.state!=='inactive'&&recorder.stop()}catch(e){}
  recording=false;
  $('micBtn').classList.remove('rec');
  $('recHint').classList.remove('show');
}

/* ---------------- profile panel ----------------
   Uses the SAME /profile/public endpoint forum.html already uses.
   Previously private-chat.html never called it at all, so you could
   not open the profile of the person you were talking to.          */
/* Tapping the thread header opens the peer's full profile page, matching
   the feed. The in-page panel below is kept as a quick inline preview for
   the Follow action without leaving the conversation. */
$('peerBtn').onclick=function(){
  if(selected) location.href='profile.html?user='+encodeURIComponent(selected);
};

function openProfile(username){
  $('ppName').textContent=username;
  $('ppAv').textContent=initial(username);
  $('ppRows').innerHTML='<div class="fh-empty" style="padding:16px">Loading…</div>';
  $('profileModal').classList.add('open');
  api('/profile/public?username='+encodeURIComponent(username)).then(function(p){
    if(p.profilePhotoId){
      $('ppAv').innerHTML='<img src="'+mediaUrl(p.profilePhotoId)+'" alt="">';
    }
    var rows='';
    function row(k,v){ if(v) rows+='<div class="pp-row"><span>'+k+'</span><b>'+esc(v)+'</b></div>'; }
    row('Location',p.location);
    row('State',p.state);
    row('Country',p.country);
    if(!rows) rows='<div class="fh-empty" style="padding:14px">This member has not added profile details.</div>';
    $('ppRows').innerHTML=rows;
    var btn=$('ppFollow');
    btn.textContent=p.following?'Following ✓':'Follow';
    btn.className='fh-btn fh-btn-block'+(p.following?' fh-btn-ghost':'');
    btn.onclick=function(){
      api('/follow',{method:'POST',body:J({username:username})}).then(function(){
        openProfile(username);
      }).catch(function(e){toast(e.message||'Could not update.')});
    };
  }).catch(function(e){
    $('ppRows').innerHTML='<div class="fh-empty" style="padding:16px">'+esc(e.message)+'</div>';
  });
}
Array.prototype.forEach.call(document.querySelectorAll('[data-close]'),function(b){
  b.onclick=function(){$('profileModal').classList.remove('open')};
});
$('profileModal').onclick=function(e){ if(e.target===this) this.classList.remove('open'); };

/* ---------------- block ---------------- */
$('blockBtn').onclick=function(){
  if(!selected)return;
  api('/blocks').then(function(d){
    var isBlocked=(d.users||[]).indexOf(selected)>=0;
    if(!confirm(isBlocked?'Unblock '+selected+'?':'Block '+selected+'? You will no longer exchange messages.'))return;
    return api(isBlocked?'/unblock':'/block',{method:'POST',body:J({other:selected})}).then(function(){
      toast(isBlocked?'Unblocked.':'Blocked.');
      loadThread(true);
    });
  }).catch(function(e){toast(e.message||'Could not update.')});
};

setInterval(loadConvs,15000);
})();
